function bidNet(b) { return Math.round((+b.unit || 0) * (+b.qty || 0) * (b.measure === 'month' ? (+b.durQty || 0) : (+b.durQty || 0) / 30)); }

function repriceDeal(d, rules) {
  rules = normRules(rules || agencyRules(d.agency));

}

/* =====================================================================
   ▶ [AJ-09b] IMPORTADOR DE AGENCIAS con ajustes de precios (de COM-24, #/importar/agencias)
   Replica el flujo real (concern Import / Importable): archivo con hojas «Agencias» y «Contactos», operaciones por ID,
   validación previa que aborta toda la carga si hay observaciones, y resultados por correo. Solo administradores.
   ===================================================================== */
const IMP_OPS = [[0, 'Solo crear agencias'], [1, 'Actualizar agencias (por ID)'], [2, 'Crear y actualizar agencias (por ID)']];
const IMP_MAX_ROWS = 2000;
const IMP_ADJ = [['minimo', 'Precio mínimo'], ['tarifa', 'Precio mensual'], ['prod', 'Precio producción'], ['serv', 'Servicios adicionales']];
const IMP_HDR_AG = ['ID', 'Nombre', 'Razón social', 'Número identificador nacional', 'Giro', 'Dirección', 'E-mail', 'Grupo'].concat(IMP_ADJ.reduce((o, a) => o.concat([a[1] + ' - Tipo de ajuste', a[1] + ' - %']), []));
const IMP_HDR_CO = ['ID', 'Tipo de contacto', 'Nombre', 'E-mail', 'Teléfono', 'Agencia (ID)'];
const impKey = h => norm(h).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const CAT_ES = { financial: 'Financiero', commercial: 'Comercial' };
const emailOk = e => !e || /^\S+@\S+\.\S+$/.test(e);
const impType = v => { v = norm(v).trim(); if (!v) return null; if (v === 'sin ajuste') return ''; if (v === 'descuento') return 'desc'; if (v === 'recargo') return 'rec'; return undefined; };
const allContacts = () => DB.agencies.reduce((o, a) => o.concat((a.contacts || []).map(c => Object.assign({ agency: a.id }, c))), []);
let IMP_LAST = [];

/* Lee una hoja y devuelve filas { n: nº de fila en el archivo, v: valores por encabezado } o los encabezados que faltan */
function impSheet(ws, headers) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
  if (!aoa.length) return { missing: headers };
  const want = headers.map(impKey), keys = (aoa[0] || []).map(impKey);
  const missing = headers.filter((h, i) => !keys.includes(want[i]));
  if (missing.length) return { missing };
  if (aoa.length - 1 > IMP_MAX_ROWS) return { tooMany: true };
  const rows = aoa.slice(1).map((r, i) => ({ n: i + 2, v: want.reduce((o, k) => { const c = r[keys.indexOf(k)]; o[k] = String(c == null ? '' : c).trim(); return o; }, {}) })).filter(r => Object.values(r.v).some(x => x !== ''));
  return { rows };
}
const gv = (r, h) => r.v[impKey(h)] || '';

/* Etapa 1 · validación previa de todo el archivo. Cualquier observación aborta la importación completa. */
function impStage1(rows, sheet, noun, existing, op, withName) {
  const skipped = [], ids = new Set(existing.map(x => String(x.id)));
  const dup = h => { const c = {}; rows.forEach(r => { const x = gv(r, h); if (x) c[x] = (c[x] || 0) + 1; }); return new Set(Object.keys(c).filter(k => c[k] > 1)); };
  const dupId = dup('ID'), dupName = withName ? dup('Nombre') : new Set();
  const plan = rows.map(r => {
    const id = gv(r, 'ID'), add = reason => skipped.push({ sheet, row: r.n, reason }); let fn;
    if (id && dupId.has(id)) add(`El archivo contiene más de un ${noun} con el ID "${id}"`);
    if (withName && gv(r, 'Nombre') && dupName.has(gv(r, 'Nombre'))) add(`El archivo contiene más de un ${noun} con el Nombre "${gv(r, 'Nombre')}"`);
    if (withName && !validRut(gv(r, 'Número identificador nacional'))) add(`Formato incorrecto para Número identificador nacional "${gv(r, 'Número identificador nacional')}"`);
    if (op === 0) { if (ids.has(id)) { add(`Ya existe un ${noun} con el ID "${id}"`); fn = 'skip'; } else fn = 'create'; }
    else if (op === 1) { if (ids.has(id)) fn = 'update'; else { add(`No se pudo encontrar un ${noun} con el ID "${id}"`); fn = 'skip'; } }
    else fn = ids.has(id) ? 'update' : 'create';
    return { r, fn };
  });
  return { plan, skipped };
}

/* Etapa 2 · importación: cada fila se valida como modelo; las fallidas se informan en el correo y el resto se importa. */
function impAgency(r, fn, res) {
  const errs = [], ex = fn === 'update' ? by(DB.agencies, gv(r, 'ID')) : null, grupo = gv(r, 'Grupo');
  if (!gv(r, 'Nombre')) errs.push('Nombre no puede estar en blanco');
  if (!emailOk(gv(r, 'E-mail'))) errs.push('E-mail no es válido');
  if (grupo) { const p = by(DB.agencies, grupo);
    if (!p) errs.push(`Grupo: no existe una agencia con el ID "${grupo}"`); else if (ex && p.id === ex.id) errs.push('No se puede asignar una agencia a sí misma');
    else if (p.parent) errs.push('El grupo elegido ya pertenece a otro grupo'); else if (ex && DB.agencies.some(a => a.parent === ex.id)) errs.push('Una agencia con subagencias no puede pertenecer a un grupo'); }
  const adj = emptyRules();
  IMP_ADJ.forEach(([key, label]) => {
    const t = impType(gv(r, label + ' - Tipo de ajuste')), praw = gv(r, label + ' - %').replace('%', '').replace(',', '.').trim();
    if (t === undefined) { errs.push(`${label}: tipo de ajuste no válido (usa Descuento, Recargo o Sin ajuste)`); return; }
    if (!t) { if (praw) errs.push(`${label}: ${t === null ? 'indica el tipo de ajuste' : '«Sin ajuste» no admite porcentaje'}`); return; }
    const p = +praw;
    if (!(p > 0)) errs.push(`${label}: el porcentaje debe ser un número mayor a 0`); else if (t === 'desc' && p > 100) errs.push(`${label}: un descuento no puede superar el 100%`); else adj[key] = { t, p };
  });
  if (errs.length) { res.skipped.push({ sheet: 'Agencias', row: r.n, reason: errs.join('; ') }); return; }
  const v = { nombre: gv(r, 'Nombre'), razon: gv(r, 'Razón social'), rut: gv(r, 'Número identificador nacional').toUpperCase(), giro: gv(r, 'Giro'), dir: gv(r, 'Dirección'), email: gv(r, 'E-mail').toLowerCase(), parent: grupo, adj };
  if (!ex) { DB.agencies.push(Object.assign({ id: nextId('A', DB.agencies), contacts: [] }, v)); res.created.ag++; return; }
  Object.assign(ex, v); res.updated.ag++;
}
function impContact(r, fn, res) {
  const errs = [], cat = { financiero: 'financial', comercial: 'commercial' }[norm(gv(r, 'Tipo de contacto'))], comp = by(DB.agencies, gv(r, 'Agencia (ID)'));
  const cur = fn === 'update' ? allContacts().find(c => String(c.id) === gv(r, 'ID')) : null;
  if (!gv(r, 'Nombre')) errs.push('Nombre no puede estar en blanco');
  if (!cat) errs.push('Tipo de contacto no es válido (usa Financiero o Comercial)');
  if (!emailOk(gv(r, 'E-mail'))) errs.push('E-mail no es válido');
  if (!comp) errs.push(`Agencia: no existe una agencia con el ID "${gv(r, 'Agencia (ID)')}"`);
  else if (cat && (comp.contacts || []).some(c => c.category === cat && (!cur || c.id !== cur.id))) errs.push('Tipo de contacto ya ha sido tomado (la agencia ya tiene un contacto de ese tipo)');
  if (errs.length) { res.skipped.push({ sheet: 'Contactos', row: r.n, reason: errs.join('; ') }); return; }
  const v = { category: cat, name: gv(r, 'Nombre'), email: gv(r, 'E-mail').toLowerCase(), phone: gv(r, 'Teléfono') };
  if (!cur) { comp.contacts = comp.contacts || []; comp.contacts.push(Object.assign({ id: 'K' + (allContacts().length + 1 + Math.floor(Math.random() * 1000)) }, v)); res.created.co++; return; }

}

    { h: 'Agencia', f: d => realAgency(d.agency) ? esc(agencyName(d.agency)) : (d.agencyTemp ? `<em>${esc(d.agencyTemp)}</em>` : '<span class="text-muted">—</span>') },
    { h: 'Precio total arriendo', cls: 'number', f: d => clp(dealLease(d)) }, { h: 'Precio total producción', cls: 'number', f: d => clp(dealProd(d)) },
    { h: '', cls: 'text-right tbl-actions text-nowrap', f: d => icBtn('edit', 'Editar', { href: '#/cotizaciones/' + d.id + '/editar' }) }], r) + pager(r.length, 'cotizaciones'); };
  CUR.refresh = () => setResults(res());
  return { title: 'Cotizaciones', html: head('Cotizaciones', btn('Crear cotización', { ic: 'plus', href: '#/cotizaciones/nueva' })) + listCard('deals', [{ n: 'q', label: 'Buscar', col: 'col-sm-6', ph: 'Título, serie o anunciante' }, { n: 'agency', label: 'Agencia', type: 'select', opts: [['', 'Todas las agencias']].concat(DB.agencies.map(a => [a.id, a.nombre])) }], res()) };
});
const clientLabel = d => d.client ? clientName(d.client) : (d.clientTemp ? `<em>${esc(d.clientTemp)}</em>` : '—');

/* =====================================================================
   ▶ [AJ-11] COTIZACIONES · formulario crear/editar con precios ajustados por agencia (de COM-27)
   ===================================================================== */
let FORM = null;
const cloneDeal = d => JSON.parse(JSON.stringify(d));
function blankDeal() { return { id: '', serial: '', client: '', clientTemp: '', agency: '', agencyTemp: '', title: '', description: '', user: USERS[0], bids: [], services: [], created: TOD, updated: TOD }; }
route(/^\/cotizaciones\/nueva$/, () => { FORM = { mode: 'new', data: blankDeal(), orig: null }; repriceDeal(FORM.data); return quoteFormPage(); });
route(/^\/cotizaciones\/([^/]+)\/editar$/, id => { const o = dealOf(id); if (!o) return notFoundPage('Cotización'); FORM = { mode: 'edit', data: cloneDeal(o), orig: o }; return quoteFormPage(); });
function newBid(item) {
  const it = itemOf(item), r = dealRules(FORM.data);
  const b = { id: 'N' + Date.now() + Math.floor(Math.random() * 1000), item, qty: 1, unit: adjVal(r.tarifa, it.tarifa), durQty: 1, measure: 'month', prod: adjVal(r.prod, it.prod) };
  b.net = bidNet(b); return b;
}

function quoteFormPage() {
  const d = FORM.data, n = FORM.mode === 'new';
  const html = `<form id="f-deal" novalidate autocomplete="off">
    <div class="card card-border-color card-border-color-primary"><div class="card-header card-header-divider">Información General${n ? '' : ` <span class="text-muted">· ${d.serial}</span>`}</div><div class="card-body"><div class="form-row"><div class="col-md">
        ${fld('Título', 'title', d.title, { req: 1 })}
        ${fld('Información adicional Cotización', 'description', d.description, { type: 'textarea', rows: 4 })}
        ${fld('Ejecutivo/a', 'user', d.user, { type: 'select', opts: USERS })}
      </div><div class="col-md">
        ${fld('Anunciante', 'client', d.client || 'placeholder', { type: 'select', opts: [['placeholder', 'Anunciante temporal (nombre de fantasía)']].concat(DB.clients.map(c => [c.id, c.nombre])) })}
        <div class="form-group"><div class="input-group input-group-sm"><div class="input-group-prepend"><div class="input-group-text">${icon('edit')}</div></div><input class="form-control" name="clientTemp" value="${esc(d.clientTemp)}" placeholder="Nombre de fantasía (temporal)" ${d.client ? 'readonly' : ''}></div></div>
        ${fld('Agencia', 'agency', d.agency || (d.agencyTemp ? 'placeholder' : ''), { type: 'select', opts: [['', 'Sin agencia'], ['placeholder', 'Agencia temporal (nombre de fantasía)']].concat(DB.agencies.map(a => [a.id, a.nombre])) })}
        <div id="adj-panel"></div>
        <div class="form-group"><div class="input-group input-group-sm"><div class="input-group-prepend"><div class="input-group-text">${icon('edit')}</div></div><input class="form-control" name="agencyTemp" value="${esc(d.agencyTemp)}" placeholder="Nombre de fantasía (temporal)" ${d.agency === '' && d.agencyTemp ? '' : 'readonly'}></div></div>
      </div></div></div></div>

    <div class="card card-table card-border-color card-border-color-primary mb-4" id="bids-card">
      <div class="card-header card-header-divider"><div class="tools"><button type="button" class="btn btn-secondary btn-sm" data-act="svc-add">${icon('plus')} Agregar servicio</button></div>Selección de soportes</div>
      <div class="card-body" id="bids-content"></div>
      <div class="card-footer pt-2">
        <table class="table-sm"><thead><tr><th class="pb-0"><label class="text-bold mb-0">Precio total arriendo:</label></th><th></th><th class="pb-0"><label class="text-bold mb-0">Precio total producción:</label></th><th></th><th class="pb-0"><label class="text-bold mb-0">Precio total campaña</label></th></tr></thead>
        <tbody><tr><td><input type="text" class="form-control form-control-sm text-bold text-right" id="t-lease" readonly></td><td class="text-muted text-center no-fill">${icon('plus')}</td><td><input type="text" class="form-control form-control-sm text-bold text-right" id="t-prod" readonly></td><td class="text-muted text-center no-fill">=</td><td><input type="text" class="form-control form-control-sm font-weight-bold text-right" id="t-total" readonly></td></tr></tbody></table>
      </div>
    </div>

    <div class="mb-3">${submitBtn(n ? 'Crear cotización' : 'Guardar cambios')}${btn('Volver al listado', { cls: 'secondary', href: '#/cotizaciones' })}</div>
  </form>
  <hr class="mb-4">
  <div class="card card-table card-border-color card-border-color-primary mb-0">${filterBar('catq', [{ n: 'q', label: 'Catálogo de soportes', col: 'col-sm-6', ph: 'Código, nombre o localidad' }, { n: 'tipo', label: 'Tipo de soporte', type: 'select', opts: [['', 'Todos los soportes']].concat(TYPES) }])}<div class="card-body" id="cat-results"></div></div>`;
  CUR.refresh = () => renderCatalog();
  return { title: n ? 'Crear cotización' : 'Editar cotización', html, after() { refreshBids(); refreshAdj(); renderCatalog(); bindQuoteForm(); } };
}

/* Etiquetas con el ajuste vigente de la agencia (las mismas del listado de agencias). Solo administradores y solo con agencia elegida. */
function refreshAdj() {
  const p = document.getElementById('adj-panel'); if (!p) return;
  p.innerHTML = realAgency(FORM.data.agency) && isAdmin() ? `<div class="adj-title">Ajuste de precios:</div>${rulesChips(agencyRules(FORM.data.agency))}` : '';
}
/* Tabla de soportes de la cotización */
const minCell = b => { const d = FORM.data, it = itemOf(b.item), r = dealRules(d), min = minOf(d, it), under = b.unit < min; return clp(min) + (under ? ` <span class="zmdi zmdi-alert-triangle text-warning" title="Este soporte se está vendiendo bajo el precio mínimo: ${clp(min)}"></span>` : ''); };
function bidRowHtml(b, i) {
  const it = itemOf(b.item), r = dealRules(FORM.data);
  return `<tr class="bid-row"><td class="no-fill text-center p-0">${i + 1}</td>
    <td>${esc(it.nombre)}<div class="sticky-sub"><b>${it.id}</b> // ${it.tipo}</div></td>
    <td class="number c-min">${minCell(b)}</td>
    <td class="number" style="width:150px"><input class="form-control form-control-sm text-right" data-k="unit" data-i="${i}" value="${b.unit}" type="number" min="0"></td><td class="text-muted text-center no-fill">×</td>
    <td class="text-center no-fill" style="width:70px"><input class="form-control form-control-sm" data-k="qty" data-i="${i}" value="${b.qty}" type="number" min="1" ${(it.unidades || 1) === 1 ? 'readonly tabindex="-1"' : `max="${it.unidades}"`}>${(it.unidades || 1) > 1 ? `<small class="text-muted">máx. ${it.unidades}</small>` : ''}</td><td class="text-muted text-center no-fill">×</td>
    <td style="width:170px"><div class="input-group input-group-sm"><input class="form-control text-center" data-k="durQty" data-i="${i}" value="${b.durQty}" type="number" min="1"><select class="form-control" data-k="measure" data-i="${i}"><option value="month" ${b.measure === 'month' ? 'selected' : ''}>mes(es)</option><option value="day" ${b.measure === 'day' ? 'selected' : ''}>día(s)</option></select></div></td><td class="text-muted text-center no-fill">=</td>
    <td style="width:130px"><input class="form-control form-control-sm text-right" data-k="net" data-i="${i}" value="${b.net}" type="number" min="0"></td>
    <td style="width:150px"><input class="form-control form-control-sm text-right" data-k="prod" data-i="${i}" value="${b.prod}" type="number" min="0"></td>
    <td class="actions text-nowrap text-center"><a href="#" class="mr-2" data-act="svc-add" data-id="${b.item}" title="Servicios adicionales de este soporte">${icon('collection-plus')}</a><a href="#" data-act="bid-rm" data-id="${i}" title="Quitar">${icon('delete')}</a></td></tr>`;
}
function svcRowHtml(s, i) {
  const r = dealRules(FORM.data), base = svcPrice(s.service, s.item);
  return `<tr class="table-active"><td class="no-fill text-center p-0">${icon('wrench')}</td><td colspan="2"><b>${esc(serviceOf(s.service).nombre)}</b><div class="sticky-sub">${serviceOf(s.service).serial} // Soporte: ${s.item} · ${s.pricing === 'lease' ? 'Arriendo' : 'Producción'}${s.start ? ' · ' + fdate(s.start) + ' → ' + fdate(s.end) : ''}</div></td><td colspan="6" class="text-muted">${esc(s.notes || '')}</td><td class="number">${s.pricing === 'lease' ? clp(s.price) : ''}</td><td class="number">${s.pricing === 'production' ? clp(s.price) : ''}</td><td class="actions text-center"><a href="#" data-act="svc-rm" data-id="${i}" title="Quitar servicio">${icon('delete')}</a></td></tr>`;
}
function refreshBids() {
  const d = FORM.data, c = document.getElementById('bids-content'); if (!c) return;
  c.innerHTML = `<div class="table-responsive"><table id="bids-table" class="table table-sm table-hover table-striped"><thead><tr>
    <th class="no-fill">Nº</th><th>Soporte</th><th class="number">P. mínimo</th><th colspan="2">Precio individual</th><th colspan="2">Unidades</th><th colspan="2">Duración</th><th>P. arriendo</th><th>P. producción</th><th></th></tr></thead>
    <tbody>${d.bids.length || d.services.length ? d.bids.map(bidRowHtml).join('') + d.services.map(svcRowHtml).join('') : '<tr><td colspan="12" class="text-center text-muted p-4">Aún no hay soportes. Selecciónalos en el catálogo que está más abajo.</td></tr>'}</tbody></table></div>`;
  refreshTotals();
}
function refreshTotals() {
  const d = FORM.data, L = document.getElementById('t-lease'); if (!L) return;
  L.value = clp(dealLease(d)); document.getElementById('t-prod').value = clp(dealProd(d)); document.getElementById('t-total').value = clp(dealTotal(d));
}
function bindQuoteForm() {
  const f = document.getElementById('f-deal'); const d = FORM.data;
  f.querySelector('[name=client]').addEventListener('change', e => { const t = f.querySelector('[name=clientTemp]'); t.readOnly = e.target.value !== 'placeholder'; if (t.readOnly) t.value = ''; });
  /* Al cambiar la agencia se recalculan TODOS los precios desde la tarifa lista con el ajuste de la nueva agencia. */
  f.querySelector('[name=agency]').addEventListener('change', e => {
    const t = f.querySelector('[name=agencyTemp]'); t.readOnly = e.target.value !== 'placeholder'; if (t.readOnly) t.value = '';
    d.agency = e.target.value === 'placeholder' ? '' : e.target.value;
    const had = d.bids.length || d.services.length; repriceDeal(d); refreshBids(); refreshAdj(); renderCatalog();
    if (had) notify('Precios actualizados según la agencia seleccionada.', 'info');
  });
  f.addEventListener('submit', e => { e.preventDefault(); saveQuote(); });
}
document.addEventListener('input', e => {
  const el = e.target; if (!FORM || !el.closest || !el.closest('#bids-table') || !el.dataset.k) return;
  const b = FORM.data.bids[+el.dataset.i]; if (!b) return; const k = el.dataset.k;
  if (k === 'measure') b.measure = el.value; else b[k] = +el.value || 0;
  const row = el.closest('tr');
  if (['unit', 'qty', 'durQty', 'measure'].includes(k)) { b.net = bidNet(b); row.querySelector('[data-k=net]').value = b.net; }
  row.querySelector('.c-min').innerHTML = minCell(b);
  refreshTotals();
});
ACT['bid-rm'] = i => { const d = FORM.data, b = d.bids[+i]; d.bids.splice(+i, 1); d.services = d.services.filter(s => !s.item || d.bids.some(x => x.item === s.item)); refreshBids(); renderCatalog(); };
ACT['svc-rm'] = i => { FORM.data.services.splice(+i, 1); refreshBids(); };
ACT['svc-add'] = item => {
  const d = FORM.data, items = d.bids.map(b => b.item);
  if (!items.length) { notify('Agrega primero un soporte a la cotización.', 'warning'); return; }
  const $m = modal({ title: 'Agregar servicio', body: `<form>${fld('Servicio', 'service', '', { type: 'select', req: 1, opts: DB.services.map(s => [s.id, s.nombre]) })}${fld('Soporte', 'item', item || items[0], { type: 'select', opts: items.map(i => [i, i + ' · ' + itemOf(i).nombre]) })}${fld('Notas', 'notes', '', { type: 'textarea', rows: 2 })}<div class="form-row">${fld('Fecha inicio', 'start', iso(addDays(14)), { type: 'date', req: 1, cls: 'col-6' })}${fld('Fecha fin', 'end', iso(addDays(44)), { type: 'date', req: 1, cls: 'col-6' })}</div>${fld('Valorización', 'pricing', 'lease', { type: 'select', opts: [['lease', 'Arriendo'], ['production', 'Producción']] })}</form>`, footer: '<button class="btn btn-primary" id="ok">Agregar</button>' });
  $m.find('#ok').on('click', () => {
    const v = k => $m.find('[name=' + k + ']').val();
    if (v('end') < v('start')) { notify('La fecha fin debe ser posterior al inicio.', 'warning'); return; }
    const base = svcPrice(v('service'), v('item'));
    if (!base) notify('El servicio no tiene precio definido para ' + v('item') + ': se agregó con $0.', 'warning');
    d.services.push({ id: 'SB' + Date.now(), service: v('service'), item: v('item'), notes: v('notes'), start: v('start'), end: v('end'), pricing: v('pricing'), price: adjVal(dealRules(d).serv, base) });
    closeModal(); refreshBids();
  });
};

/* Catálogo para agregar soportes: muestra los precios ya ajustados por la agencia elegida */
function renderCatalog() {
  const el = document.getElementById('cat-results'); if (!el) return;
  const f = FS.catq || {}, r = DB.items.filter(i => match(i.id + i.nombre + i.comuna, f.q) && (!f.tipo || i.tipo === f.tipo)), added = FORM.data.bids.map(b => b.item), rules = dealRules(FORM.data);
  const pc = (rule, v) => clp(adjVal(rule, v));
  el.innerHTML = tbl([{ h: icon('assignment'), cls: 'no-fill text-center', f: i => `<span class="zmdi zmdi-${added.includes(i.id) ? 'check-circle text-success' : 'plus-circle-o text-muted'}" style="font-size:1.3rem"></span>` },
    { h: 'Código', f: i => `<b class="text-nowrap">${i.id}</b>` }, { h: 'Tipo de soporte', f: i => i.tipo }, { h: 'Nombre', f: i => esc(i.nombre) }, { h: 'Localidad', f: i => i.comuna },
    { h: 'Precio mínimo', cls: 'number', f: i => pc(rules.minimo, i.minimo) }, { h: 'Precio mensual', cls: 'number', f: i => pc(rules.tarifa, i.tarifa) }, { h: 'Precio producción', cls: 'number', f: i => pc(rules.prod, i.prod) }], r) + pager(r.length, 'soportes');
  el.querySelectorAll('tbody tr').forEach((tr, i) => { tr.classList.add('cursor-pointer'); tr.title = 'Clic para agregar a la cotización'; tr.addEventListener('click', () => addItemToForm(r[i].id)); });
}
function addItemToForm(id) {
  const d = FORM.data;
  if (d.bids.some(b => b.item === id)) { notify(id + ' ya está en la cotización.', 'info'); return; }
  d.bids.push(newBid(id)); refreshBids(); renderCatalog(); notify(id + ' agregado a la cotización.');
}

/* Guardar */
function saveQuote() {
  const f = document.getElementById('f-deal'), fd = new FormData(f), d = FORM.data, errs = [];
  d.title = fd.get('title').trim(); d.description = fd.get('description'); d.user = fd.get('user');
  d.client = fd.get('client') === 'placeholder' ? '' : fd.get('client'); d.clientTemp = d.client ? '' : fd.get('clientTemp').trim();
  d.agency = fd.get('agency') === 'placeholder' ? '' : fd.get('agency'); d.agencyTemp = fd.get('agency') === 'placeholder' ? fd.get('agencyTemp').trim() : '';
  if (!d.title) errs.push('El título es obligatorio.');
  if (!d.client && !d.clientTemp) errs.push('Selecciona un anunciante o ingresa un nombre de fantasía temporal.');
  if (errs.length) { notify(errs.join('<br>'), 'warning'); return; }
  d.updated = TOD;
  if (FORM.mode === 'new') { const t = Object.assign({}, d, { id: 'D' + (Math.max(...DB.deals.map(x => +x.id.slice(1))) + 1), serial: nextSerial(), created: TOD }); DB.deals.push(t); notify('La cotización ha sido creada exitosamente.'); go('/cotizaciones/' + t.id + '/editar'); return; }
  Object.assign(FORM.orig, cloneDeal(d)); FORM.data = cloneDeal(FORM.orig); notify('Los cambios fueron guardados.'); refreshBids(); refreshAdj();
}

/* =====================================================================
   ▶ [AJ-12] ARRANQUE · carga inicial
   ===================================================================== */
paintMenu();
$(document).ready(function () { render(); });
})();
</script>
</body>
</html>
