    <meta charset="UTF-8" />

    <!-- Tailwind CSS -->

    <!-- React & ReactDOM -->

<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { createPortal } = ReactDOM;

        // Constants
        const TOTAL_CAMPAIGN = 52785889;

        const SUPPORTS = [
            {
                id: '1',
                name: 'Soporte 001 Valla - Concepción',
                serial: 'T-001',
                format: 'Mobiliario Urbano Impreso - Otros',
                monthlyPrice: 2000000,
                units: 1,
                durationText: '12 meses',
                rentPrice: 40666667,
                productionPrice: 394568,
                totalPrice: 41061235,
                startDate: '2026-01-01',
                endDate: '2026-12-31',
            },
            {
                id: '2',
                name: 'Soporte 002 Valla - Renca',
                serial: 'T-002',
                format: 'Valla',
                monthlyPrice: 2000000,
                units: 1,
                durationText: '12 meses',
                rentPrice: 11474654,
                productionPrice: 250000,
                totalPrice: 11724654,
                startDate: '2026-01-01',
                endDate: '2026-12-31',
            }
        ];

        const formatCLP = (value) => {
            return new Intl.NumberFormat('es-CL', {
                style: 'currency',
                currency: 'CLP',
                maximumFractionDigits: 0
            }).format(value);
        };

        const getMonthsDifference = (start, end) => {
            const [y1, m1] = start.split('-').map(Number);
            const [y2, m2] = end.split('-').map(Number);
            let months = (y2 - y1) * 12;
            months -= (m1 - 1);
            months += (m2 - 1);
            return months <= 0 ? 0 : months + 1;
        };

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}-${month}-${year}`;
        };

        const getPeriodLabelFromKey = (monthKey) => {
            const [year, month] = monthKey.split('-').map(Number);
            const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            return `${months[month - 1]} ${year}`;
        };

        const getMonthKey = (date) => {
            if (typeof date === 'string') return getMonthKeyFromDateString(date);
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        const getMonthKeyFromDateString = (dateStr) => {
            const [y, m] = dateStr.split('-').map(Number);
            return `${y}-${String(m).padStart(2, '0')}`;
        };

        const addMonthsToKey = (monthKey, months) => {
            const [y, m] = monthKey.split('-').map(Number);
            let targetY = y;
            let targetM = m + months;
            while (targetM > 12) {
                targetM -= 12;
                targetY += 1;
            }
            while (targetM < 1) {
                targetM += 12;
                targetY -= 1;
            }
            return `${targetY}-${String(targetM).padStart(2, '0')}`;
        };

        const getMonthsInRange = (start, end) => {
            const months = [];
            const [sy, sm] = start.split('-').map(Number);
            const [ey, em] = end.split('-').map(Number);
            
            let cy = sy;
            let cm = sm;
            
            while (cy < ey || (cy === ey && cm <= em)) {
                months.push(`${cy}-${String(cm).padStart(2, '0')}`);
                cm++;
                if (cm > 12) {
                    cm = 1;
                    cy++;
                }
            }
            return months;
        };

        // Icon Component Polyfill for browser Lucide
        const Icon = ({ name, className, size = 16 }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- COMPONENTS ---

        function GeneralTab() {
            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-lg shadow border-t-4 border-t-blue-500">
                        <div className="border-b border-gray-200 px-6 py-4">
                            <h3 className="text-xl font-semibold text-gray-800">Información General</h3>
                        </div>
                        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-3">
                                {[['Título', 'Demo periodo mas de un año'], ['Código', 'CA-6578'], ['Anunciante', 'Almac'], ['Agencia', 'Agencia Marketplace'], ['Ejecutivo/a', 'Ignacio Rodríguez']].map(([dt, dd]) => (
                                    <dl key={dt} className="grid grid-cols-3">
                                        <dt className="text-gray-600 font-medium col-span-1">{dt}</dt>
                                        <dd className="col-span-2">{dd}</dd>
                                    </dl>
                                ))}
                            </div>
                            <div className="space-y-3">
                                {[['Fecha creación', '13-03-2026 15:56'], ['Última actualización', '13-03-2026 15:56'], ['Período', '01-01-2026 ─ 31-12-2026'], ['Facturar a', 'Anunciante'], ['Condición de pago', '30 días']].map(([dt, dd]) => (
                                    <dl key={dt} className="grid grid-cols-3">
                                        <dt className="text-gray-600 font-medium col-span-1">{dt}</dt>
                                        <dd className="col-span-2">{dd}</dd>
                                    </dl>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="border-b border-gray-200 px-6 py-4">
                            <h3 className="text-xl font-semibold text-gray-800">Soportes contratados</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="min-w-full text-sm text-left">
                                <thead className="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th className="px-4 py-3 font-semibold text-gray-700">Nº</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700">Soporte</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-right">Precio mensual</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-center">Unidades</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-center">Duración</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-right">P. arriendo</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-right">P. producción</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200 bg-white">
                                    {SUPPORTS.map((support, idx) => (
                                        <tr key={support.id} className="hover:bg-gray-50">
                                            <td className="px-4 py-3">{idx + 1}</td>
                                            <td className="px-4 py-3">
                                                <div>{support.name}</div>
                                                <div className="text-xs text-gray-500"><b>{support.serial}</b> // {support.format}</div>
                                            </td>
                                            <td className="px-4 py-3 text-right whitespace-nowrap">{formatCLP(support.monthlyPrice)}</td>
                                            <td className="px-4 py-3 text-center">{support.units}</td>
                                            <td className="px-4 py-3 text-center">{support.durationText}</td>
                                            <td className="px-4 py-3 text-right font-medium whitespace-nowrap">{formatCLP(support.rentPrice)}</td>
                                            <td className="px-4 py-3 text-right font-medium whitespace-nowrap">{formatCLP(support.productionPrice)}</td>
                                        </tr>
                                    ))}
                                    <tr className="bg-gray-100">
                                        <td colSpan={5} className="px-4 py-3 text-right font-bold text-lg text-gray-800">Precio total campaña:</td>
                                        <td colSpan={2} className="px-4 py-3 text-right font-bold text-lg text-blue-700 border-l border-gray-200">
                                            {formatCLP(TOTAL_CAMPAIGN)} <span className="text-sm text-gray-500 font-normal">+ IVA</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function FacturacionTab() {
            const [distMode, setDistMode] = useState('general'); // 'general' | 'individual'
            const [numPayments, setNumPayments] = useState('');
            const [numPaymentsError, setNumPaymentsError] = useState(false);
            const [startPaymentMonth, setStartPaymentMonth] = useState('2026-01');
            const [individualStartMonths, setIndividualStartMonths] = useState({}); // { supportId: monthKey }
            const [isMonthPickerOpen, setIsMonthPickerOpen] = useState(false);
            const [activeSupportPicker, setActiveSupportPicker] = useState(null); // supportId for individual picker
            const [pickerYear, setPickerYear] = useState(2026);
            const [individualPayments, setIndividualPayments] = useState({}); // { supportId: count }
            const [billingRecords, setBillingRecords] = useState([]); // [{ supportId, monthKey, amount }]
            const [monthlyMetadata, setMonthlyMetadata] = useState({}); // { monthKey: { amountPaid, paymentDate, invoicedAmount } }
            const [savedMetadata, setSavedMetadata] = useState({}); // Metadata that affects the summary cards
            const [filterSupportIds, setFilterSupportIds] = useState([]);
            const [isFilterOpen, setIsFilterOpen] = useState(false);
            const [activeModalMonth, setActiveModalMonth] = useState(null); // monthKey for the modal
            const [activeActionMenu, setActiveActionMenu] = useState(null); // monthKey for dropdown

            const applyDistribution = () => {
                if (distMode === 'general' && (!numPayments || Number(numPayments) <= 0)) {
                    setNumPaymentsError(true);
                    return;
                }
                setNumPaymentsError(false);

                let newRecords = [];
                SUPPORTS.forEach(support => {
                    const id = support.id;
                    const paymentsCount = distMode === 'general' ? Number(numPayments) : (individualPayments[id] || 1);
                    const startMonth = distMode === 'general' ? startPaymentMonth : (individualStartMonths[id] || getMonthKeyFromDateString(support.startDate));
                    
                    // Amount per payment
                    const baseAmount = Math.floor(support.totalPrice / paymentsCount);
                    const remainder = support.totalPrice - (baseAmount * paymentsCount);
                    
                    // Payment months range
                    const paymentMonths = [];
                    const [sy, sm] = startMonth.split('-').map(Number);
                    let tempDate = new Date(sy, sm - 1, 1);
                    for (let i = 0; i < paymentsCount; i++) {
                        paymentMonths.push(getMonthKey(tempDate));
                        tempDate.setMonth(tempDate.getMonth() + 1);
                    }
                    
                    // Campaign months range
                    const campaignMonths = getMonthsInRange(support.startDate, support.endDate);
                    
                    // Union of all months to display
                    const allMonthKeys = Array.from(new Set([...campaignMonths, ...paymentMonths])).sort();
                    
                    allMonthKeys.forEach(mKey => {
                        let amount = 0;
                        const pIdx = paymentMonths.indexOf(mKey);
                        if (pIdx !== -1) {
                            amount = baseAmount + (pIdx === 0 ? remainder : 0);
                        }
                        
                        newRecords.push({
                            supportId: id,
                            monthKey: mKey,
                            amount: amount
                        });
                    });
                });
                setBillingRecords(newRecords);
                // Reset metadata overrides when applying new distribution
                setMonthlyMetadata({});
            };

            // Calculated data for the consolidated table
            const consolidatedData = useMemo(() => {
                const grouped = {};
                const filteredRecords = billingRecords.filter(r => 
                    filterSupportIds.length === 0 || filterSupportIds.includes(r.supportId)
                );

                filteredRecords.forEach(record => {
                    const monthKey = record.monthKey;
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = {
                            monthKey,
                            label: getPeriodLabelFromKey(monthKey),
                            amountInvoiced: 0,
                            supports: []
                        };
                    }
                    grouped[monthKey].amountInvoiced += record.amount;
                    if (!grouped[monthKey].supports.includes(record.supportId)) {
                        grouped[monthKey].supports.push(record.supportId);
                    }
                });

                return Object.values(grouped).sort((a, b) => a.monthKey.localeCompare(b.monthKey));
            }, [billingRecords, filterSupportIds]);

            const totalPaid = useMemo(() => {
                return Object.values(savedMetadata).reduce((sum, meta) => sum + Number(meta.amountPaid || 0), 0);
            }, [savedMetadata]);

            const totalInvoiced = useMemo(() => {
                return consolidatedData.reduce((sum, month) => {
                    const val = monthlyMetadata[month.monthKey]?.invoicedAmount ?? month.amountInvoiced;
                    return sum + Number(val);
                }, 0);
            }, [consolidatedData, monthlyMetadata]);

            const totalPending = useMemo(() => {
                return Math.max(0, totalInvoiced - totalPaid);
            }, [totalInvoiced, totalPaid]);

            const handleUpdateMetadata = (monthKey, field, value) => {
                setMonthlyMetadata(prev => ({
                    ...prev,
                    [monthKey]: {
                        ...(prev[monthKey] || { amountPaid: 0, paymentDate: '', invoicedAmount: null }),
                        [field]: value
                    }
                }));
            };

            const bonificarMes = (monthKey, amountInvoiced) => {
                handleUpdateMetadata(monthKey, 'amountPaid', amountInvoiced);
                setActiveActionMenu(null);
            };

            const moverPago = (monthKey) => {
                const index = consolidatedData.findIndex(m => m.monthKey === monthKey);
                if (index === -1) return;

                const currentMonth = consolidatedData[index];
                const currentVal = monthlyMetadata[monthKey]?.invoicedAmount ?? currentMonth.amountInvoiced;

                // Set current to 0
                handleUpdateMetadata(monthKey, 'invoicedAmount', 0);

                // Add to next
                const nextMonth = consolidatedData[index + 1];
                if (nextMonth) {
                    const nextVal = monthlyMetadata[nextMonth.monthKey]?.invoicedAmount ?? nextMonth.amountInvoiced;
                    handleUpdateMetadata(nextMonth.monthKey, 'invoicedAmount', Number(nextVal) + Number(currentVal));
                } else {
                    alert('No hay mes siguiente para mover el pago.');
                }
                setActiveActionMenu(null);
            };

            const handleSave = () => {
                setSavedMetadata({ ...monthlyMetadata });
                alert('Distribución de pagos guardada correctamente.');
            };

            const selectedMonthData = activeModalMonth ? consolidatedData.find(m => m.monthKey === activeModalMonth) : null;

            return (
                <div className="space-y-6 pb-20">
                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 border rounded-lg shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-gray-500 font-medium text-sm">Total Campaña (sin IVA)</span>
                            <span className="text-3xl font-bold text-gray-800">{formatCLP(TOTAL_CAMPAIGN)}</span>
                        </div>
                        <div className="bg-white p-6 border rounded-lg shadow-sm border-l-4 border-l-green-500 flex flex-col items-center justify-center text-center">
                            <span className="text-gray-500 font-medium text-sm">Suma Valores Pagado</span>
                            <span className="text-3xl font-bold text-green-600">{formatCLP(totalPaid)}</span>
                        </div>
                        <div className="bg-white p-6 border rounded-lg shadow-sm border-l-4 border-l-red-500 flex flex-col items-center justify-center text-center">
                            <span className="text-gray-500 font-medium text-sm">Saldo Pendiente por Recibir</span>
                            <span className="text-3xl font-bold text-red-600">{formatCLP(totalPending)}</span>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow p-6 space-y-6">
                        <div className="border-b pb-4 space-y-4">
                            <h3 className="text-lg font-semibold text-gray-800">Distribución por Soporte</h3>
                            
                            {/* Mode Toggle */}
                            <div className="flex bg-gray-100 p-1 rounded-lg w-fit">
                                <button 
                                    onClick={() => setDistMode('general')}
                                    className={`px-6 py-1.5 rounded-md text-sm font-bold transition flex items-center ${distMode === 'general' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    General
                                </button>
                                <button 
                                    onClick={() => setDistMode('individual')}
                                    className={`px-6 py-1.5 rounded-md text-sm font-bold transition flex items-center ${distMode === 'individual' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    Individual
                                </button>
                            </div>
                        </div>

                        <div className="flex flex-col md:flex-row md:items-start gap-8">
                            <div className="flex flex-col md:flex-row md:items-end gap-x-6 flex-1">
                                <div className="space-y-4">
                                    <label className="block text-sm font-bold text-gray-700">Número de pagos</label>
                                    <div className="flex items-center space-x-2 relative">
                                        <div className="relative">
                                            <input 
                                                type="number" 
                                                min="1"
                                                disabled={distMode === 'individual'}
                                                value={numPayments}
                                                onChange={(e) => {
                                                    setNumPayments(e.target.value);
                                                    if (e.target.value && Number(e.target.value) > 0) {
                                                        setNumPaymentsError(false);
                                                    }
                                                }}
                                                className={`w-32 border-2 bg-white rounded-md px-3 py-2 text-sm disabled:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400 focus:ring-2 focus:ring-blue-500 transition-all font-bold shadow-sm ${numPaymentsError ? 'border-red-500 ring-red-500' : 'border-gray-300'}`}
                                            />
                                            {numPaymentsError && (
                                                <p className="text-red-500 text-[10px] font-bold absolute top-full left-0 mt-1 whitespace-nowrap">
                                                    Ingresar valor mayor a 0
                                                </p>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-4 relative mt-4 md:mt-0">
                                    <label className="block text-sm font-bold text-gray-700">Mes de inicio</label>
                                    <button 
                                        onClick={() => setIsMonthPickerOpen(!isMonthPickerOpen)}
                                        className="min-w-44 border-2 border-gray-300 bg-white rounded-md px-3 py-2 text-sm font-bold shadow-sm flex items-center justify-between hover:border-gray-400 transition-all focus:ring-2 focus:ring-blue-500 outline-none"
                                    >
                                        <span>{getPeriodLabelFromKey(startPaymentMonth)}</span>
                                        <Icon name="calendar" size={16} className="text-blue-500" />
                                    </button>
                                    
                                    {isMonthPickerOpen && (
                                        <>
                                            <div className="fixed inset-0 z-50" onClick={() => setIsMonthPickerOpen(false)}></div>
                                            <div className="absolute top-full left-0 mt-2 w-64 bg-white border rounded-xl shadow-2xl z-[60] overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200">
                                                <div className="p-1">
                                                    <div className="flex items-center justify-between p-2 bg-gray-50 border-b">
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); setPickerYear(pickerYear - 1); }} 
                                                            className="p-1.5 hover:bg-gray-200 rounded-lg transition-colors"
                                                        >
                                                            <Icon name="chevron-left" />
                                                        </button>
                                                        <span className="font-bold text-gray-800 tabular-nums">{pickerYear}</span>
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); setPickerYear(pickerYear + 1); }} 
                                                            className="p-1.5 hover:bg-gray-200 rounded-lg transition-colors"
                                                        >
                                                            <Icon name="chevron-right" />
                                                        </button>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-1 p-2">
                                                        {['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'].map((m, idx) => {
                                                            const mKey = `${pickerYear}-${String(idx + 1).padStart(2, '0')}`;
                                                            const isSelected = startPaymentMonth === mKey;
                                                            return (
                                                                <button
                                                                    key={m}
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        setStartPaymentMonth(mKey);
                                                                        setIsMonthPickerOpen(false);
                                                                    }}
                                                                    className={`py-2.5 text-sm font-semibold rounded-lg transition-all ${
                                                                        isSelected 
                                                                            ? 'bg-blue-600 text-white shadow-md scale-105' 
                                                                            : 'hover:bg-blue-50 text-gray-700 hover:text-blue-600'
                                                                    }`}
                                                                >
                                                                    {m}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>

                            <button 
                                onClick={applyDistribution}
                                className={`self-end px-8 py-3 rounded-md font-bold transition flex items-center bg-blue-600 text-white hover:bg-blue-700 shadow-lg`}
                            >
                                <Icon name="refresh-cw" className="mr-2" /> Aplicar Distribución
                            </button>
                        </div>

                        <div className="overflow-x-auto border border-gray-200 rounded">
                            <table className="min-w-full text-sm text-left">
                                <thead className="bg-gray-50 border-b">
                                    <tr>
                                        <th className="px-4 py-3 font-semibold text-gray-700">Soporte</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-center">Duración</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-center">Período</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-right">Precio Total</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-center w-32">Cant. Pagos</th>
                                        <th className="px-4 py-3 font-semibold text-gray-700 text-center w-40">Mes Inicio</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {SUPPORTS.map(support => (
                                        <tr key={support.id} className="hover:bg-gray-50">
                                            <td className="px-4 py-3">
                                                <div className="font-bold text-gray-900">{support.name}</div>
                                                <div className="text-xs text-gray-500">{support.serial} // {support.format}</div>
                                            </td>
                                            <td className="px-4 py-3 text-center text-xs text-gray-600 font-medium whitespace-nowrap">
                                                {support.durationText}
                                            </td>
                                            <td className="px-4 py-3 text-center text-xs text-gray-600 whitespace-nowrap">
                                                {formatDate(support.startDate)} ─ {formatDate(support.endDate)}
                                            </td>
                                            <td className="px-4 py-3 text-right font-medium text-gray-900 whitespace-nowrap">{formatCLP(support.totalPrice)}</td>
                                            <td className="px-4 py-3">
                                                <div className="relative">
                                                    <input 
                                                        type="number" 
                                                        min="1"
                                                        disabled={distMode === 'general'}
                                                        value={individualPayments[support.id] || 1}
                                                        onChange={(e) => setIndividualPayments(prev => ({ ...prev, [support.id]: Math.max(1, Number(e.target.value)) }))}
                                                        className="w-full border-2 border-gray-300 bg-white rounded-md px-3 py-1.5 text-xs disabled:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400 focus:ring-2 focus:ring-blue-500 transition-all font-bold shadow-sm hover:border-gray-400"
                                                    />
                                                </div>
                                            </td>
                                            <td className="px-4 py-3">
                                                <div className="relative">
                                                    <button 
                                                        disabled={distMode === 'general'}
                                                        onClick={(e) => {
                                                            const rect = e.currentTarget.getBoundingClientRect();
                                                            setActiveSupportPicker(activeSupportPicker === support.id ? null : { id: support.id, rect });
                                                        }}
                                                        className="w-full border-2 border-gray-300 bg-white rounded-md px-3 py-1.5 text-[10px] font-bold shadow-sm flex items-center justify-between hover:border-gray-400 transition-all focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-50 disabled:text-gray-400 disabled:border-gray-200"
                                                    >
                                                        <span>{getPeriodLabelFromKey(individualStartMonths[support.id] || getMonthKeyFromDateString(support.startDate))}</span>
                                                        <Icon name="calendar" size={12} className={distMode === 'general' ? 'text-gray-300' : 'text-blue-500'} />
                                                    </button>
                                                    
                                                    {activeSupportPicker?.id === support.id && createPortal(
                                                        <>
                                                            <div className="fixed inset-0 z-[110]" onClick={() => setActiveSupportPicker(null)}></div>
                                                            <div 
                                                                className="fixed bg-white border rounded-lg shadow-2xl z-[120] overflow-hidden animate-in fade-in slide-in-from-top-1 duration-150 w-48"
                                                                style={{ 
                                                                    top: activeSupportPicker.rect.bottom + 8, 
                                                                    left: activeSupportPicker.rect.right - 192 // 192px is w-48
                                                                }}
                                                            >
                                                                <div className="p-1">
                                                                    <div className="flex items-center justify-between p-1 bg-gray-50 border-b">
                                                                        <button onClick={() => setPickerYear(pickerYear - 1)} className="p-1 hover:bg-gray-200 rounded"><Icon name="chevron-left" size={12} /></button>
                                                                        <span className="text-[10px] font-bold">{pickerYear}</span>
                                                                        <button onClick={() => setPickerYear(pickerYear + 1)} className="p-1 hover:bg-gray-200 rounded"><Icon name="chevron-right" size={12} /></button>
                                                                    </div>
                                                                    <div className="grid grid-cols-3 gap-0.5 p-1">
                                                                        {['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'].map((m, idx) => {
                                                                            const mKey = `${pickerYear}-${String(idx + 1).padStart(2, '0')}`;
                                                                            const currentStart = individualStartMonths[support.id] || getMonthKeyFromDateString(support.startDate);
                                                                            const isSelected = currentStart === mKey;
                                                                            return (
                                                                                <button
                                                                                    key={m}
                                                                                    onClick={() => {
                                                                                        setIndividualStartMonths(prev => ({ ...prev, [support.id]: mKey }));
                                                                                        setActiveSupportPicker(null);
                                                                                    }}
                                                                                    className={`py-1 text-[10px] font-bold rounded ${isSelected ? 'bg-blue-600 text-white' : 'hover:bg-blue-50 text-gray-700'}`}
                                                                                >
                                                                                    {m}
                                                                                </button>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </>,
                                                        document.body
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {billingRecords.length > 0 && (
                        <div className="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
                            <div className="border-b border-gray-200 px-6 py-4 flex items-center justify-between bg-gray-50">
                                <h3 className="text-lg font-bold text-gray-800 underline decoration-blue-500 underline-offset-8">Distribución de pagos</h3>
                                <div className="flex items-center space-x-3 flex-1 justify-end">
                                    <div className="text-xs px-2 py-1 bg-blue-100 text-blue-800 rounded-full font-bold">
                                        {consolidatedData.length} Meses
                                    </div>
                                    <button onClick={() => setIsFilterOpen(!isFilterOpen)} className="flex items-center text-sm font-medium border rounded px-3 py-1 bg-white hover:bg-gray-50 shadow-sm relative">
                                        <Icon name="filter" className="mr-2 text-blue-500" />
                                        Soportes ({filterSupportIds.length || 'Todos'})
                                        {isFilterOpen && (
                                            <div className="absolute top-full right-0 mt-2 w-64 bg-white border rounded-lg shadow-xl z-50 p-2 space-y-1">
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); setFilterSupportIds([]); }}
                                                    className="w-full text-left px-2 py-1.5 text-xs text-blue-600 hover:bg-blue-50 rounded"
                                                >
                                                    Limpiar Filtros
                                                </button>
                                                <div className="max-h-60 overflow-y-auto">
                                                    {SUPPORTS.map(s => (
                                                        <label key={s.id} className="flex items-center px-2 py-2 hover:bg-gray-50 rounded cursor-pointer">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={filterSupportIds.includes(s.id)}
                                                                onChange={() => {
                                                                    if (filterSupportIds.includes(s.id)) {
                                                                        setFilterSupportIds(filterSupportIds.filter(fid => fid !== s.id));
                                                                    } else {
                                                                        setFilterSupportIds([...filterSupportIds, s.id]);
                                                                    }
                                                                }}
                                                                className="w-3 h-3 text-blue-600 rounded"
                                                            />
                                                            <span className="ml-2 text-xs truncate">{s.name}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </button>
                                    <button 
                                        onClick={handleSave}
                                        className="bg-green-600 text-white px-4 py-1.5 rounded-md text-sm font-bold flex items-center hover:bg-green-700 transition shadow-sm"
                                    >
                                        <Icon name="save" className="mr-2" size={16} />
                                        Guardar
                                    </button>
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="min-w-full text-xs text-left">
                                    <thead className="bg-gray-100 border-b border-gray-200">
                                        <tr>
                                            <th className="px-4 py-3 font-bold text-gray-600 uppercase tracking-wider">Mes Calendario</th>
                                            <th className="px-4 py-3 font-bold text-gray-600 uppercase tracking-wider text-center">Cantidad de soportes</th>
                                            <th className="px-4 py-3 font-bold text-gray-600 uppercase tracking-wider text-right">Monto Facturado</th>
                                            <th className="px-4 py-3 font-bold text-gray-600 uppercase tracking-wider text-right">Monto Pagado</th>
                                            <th className="px-4 py-3 font-bold text-gray-600 uppercase tracking-wider text-right">Saldo</th>
                                            <th className="px-4 py-3 font-bold text-gray-600">Fecha Pago</th>
                                            <th className="px-4 py-3 text-center">Adjunto</th>
                                            <th className="px-4 py-3 text-center w-10">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200 bg-white">
                                        {consolidatedData.map(month => {
                                            const metadata = monthlyMetadata[month.monthKey] || { amountPaid: 0, paymentDate: '', invoicedAmount: null };
                                            const currentInvoiced = metadata.invoicedAmount !== null ? metadata.invoicedAmount : month.amountInvoiced;
                                            const pending = Math.max(0, Number(currentInvoiced) - Number(metadata.amountPaid));
                                            
                                            // Exhibition indicator check
                                            const isExhibitionMonth = month.supports.some(sId => {
                                                const s = SUPPORTS.find(sup => sup.id === sId);
                                                if (!s) return false;
                                                const mk = month.monthKey;
                                                return mk >= getMonthKeyFromDateString(s.startDate) && mk <= getMonthKeyFromDateString(s.endDate);
                                            });

                                            return (
                                                <tr key={month.monthKey} className="hover:bg-blue-50/20 transition-colors">
                                                    <td className="px-4 py-4 font-bold text-gray-900 bg-gray-50/30 whitespace-nowrap">
                                                        <div className="flex flex-col">
                                                            <div className="flex items-center">
                                                                <Icon name="calendar" className="mr-2 text-gray-400" />
                                                                {month.label}
                                                            </div>
                                                            {isExhibitionMonth && (
                                                                <span className="ml-6 text-[10px] text-blue-600 font-bold uppercase tracking-wider">Exhibición</span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="px-4 py-4 text-center">
                                                        <button 
                                                            onClick={() => setActiveModalMonth(month.monthKey)}
                                                            className="inline-flex items-center justify-center h-8 w-8 rounded-full bg-blue-100 text-blue-700 font-bold hover:bg-blue-200 transition-colors shadow-sm"
                                                        >
                                                            {month.supports.length}
                                                        </button>
                                                    </td>
                                                    <td className="px-4 py-4 text-right">
                                                        <div className="flex justify-end items-center">
                                                            <span className="mr-1 text-gray-400 font-mono">$</span>
                                                            <input 
                                                                type="number" 
                                                                value={metadata.invoicedAmount !== null ? metadata.invoicedAmount : month.amountInvoiced} 
                                                                onChange={(e) => handleUpdateMetadata(month.monthKey, 'invoicedAmount', e.target.value)} 
                                                                className="w-24 border border-gray-300 rounded px-2 py-1 text-right focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-inner font-medium text-gray-900" 
                                                            />
                                                        </div>
                                                    </td>
                                                    <td className="px-4 py-4 text-right">
                                                        <div className="flex justify-end items-center">
                                                            <span className="mr-1 text-gray-400 font-mono">$</span>
                                                            <input 
                                                                type="number" 
                                                                value={metadata.amountPaid || ''} 
                                                                onChange={(e) => handleUpdateMetadata(month.monthKey, 'amountPaid', e.target.value)} 
                                                                placeholder="0"
                                                                className="w-24 border border-gray-300 rounded px-2 py-1 text-right focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-inner" 
                                                            />
                                                        </div>
                                                    </td>
                                                    <td className={`px-4 py-4 text-right font-bold tabular-nums ${pending > 0 ? 'text-red-500' : 'text-green-600'}`}>
                                                        {formatCLP(pending)}
                                                    </td>
                                                    <td className="px-4 py-4">
                                                        <input 
                                                            type="date" 
                                                            value={metadata.paymentDate} 
                                                            onChange={(e) => handleUpdateMetadata(month.monthKey, 'paymentDate', e.target.value)} 
                                                            className="border border-gray-300 rounded px-2 py-1 text-[10px] focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" 
                                                        />
                                                    </td>
                                                    <td className="px-4 py-4 text-center">
                                                        <label className="cursor-pointer bg-white border border-gray-200 rounded p-1.5 inline-flex items-center justify-center hover:bg-blue-50 text-blue-600 transition-all shadow-sm">
                                                            <Icon name="paperclip" />
                                                            <input type="file" className="hidden" />
                                                        </label>
                                                    </td>
                                                    <td className="px-4 py-4 text-center relative">
                                                        <button 
                                                            onClick={() => setActiveActionMenu(activeActionMenu === month.monthKey ? null : month.monthKey)}
                                                            className="p-1.5 rounded-full hover:bg-gray-100 text-gray-500"
                                                        >
                                                            <Icon name="more-vertical" />
                                                        </button>
                                                        {activeActionMenu === month.monthKey && (
                                                            <>
                                                                <div 
                                                                    className="fixed inset-0 z-10" 
                                                                    onClick={() => setActiveActionMenu(null)}
                                                                ></div>
                                                                <div className="absolute right-0 top-full mt-1 w-40 bg-white border rounded-lg shadow-xl z-20 overflow-hidden divide-y divide-gray-100 animate-in fade-in slide-in-from-top-1 duration-150">
                                                                    <button 
                                                                        onClick={() => bonificarMes(month.monthKey, currentInvoiced)}
                                                                        className="w-full text-left px-4 py-2 text-sm hover:bg-green-50 text-green-700 flex items-center font-medium"
                                                                    >
                                                                        <Icon name="check-circle" className="mr-2" size={14} />
                                                                        Bonificar
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => moverPago(month.monthKey)}
                                                                        className="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-blue-700 flex items-center font-medium"
                                                                    >
                                                                        <Icon name="arrow-right-circle" className="mr-2" size={14} />
                                                                        Mover pago
                                                                    </button>
                                                                </div>
                                                            </>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            <div className="bg-gray-50 p-4 border-t border-gray-200 flex justify-end">
                                <button 
                                    onClick={handleSave}
                                    className="bg-green-600 text-white px-8 py-2 rounded-md font-bold flex items-center hover:bg-green-700 transition shadow-md"
                                >
                                    <Icon name="save" className="mr-2" />
                                    Guardar
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Simple Modal for Support List */}
                    {activeModalMonth && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="border-b px-6 py-4 flex items-center justify-between bg-gray-50">
                                    <h4 className="font-bold text-gray-800">Soportes ({selectedMonthData?.label})</h4>
                                    <button onClick={() => setActiveModalMonth(null)} className="text-gray-400 hover:text-gray-600 transition-colors">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="p-6 max-h-80 overflow-y-auto">
                                    <ul className="space-y-3">
                                        {selectedMonthData?.supports.map(sid => {
                                            const s = SUPPORTS.find(x => x.id === sid);
                                            return (
                                                <li key={sid} className="flex items-center p-3 bg-gray-50 rounded-lg border border-gray-100 italic text-sm text-gray-700">
                                                    <div className="h-6 w-6 rounded-full bg-blue-100 text-blue-600 text-[10px] font-bold flex items-center justify-center mr-3 flex-shrink-0">
                                                        {sid}
                                                    </div>
                                                    {s?.name}
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </div>
                                <div className="p-4 border-t bg-gray-50 flex justify-end">
                                    <button onClick={() => setActiveModalMonth(null)} className="px-6 py-2 bg-white border border-gray-300 rounded-md text-sm font-bold text-gray-700 hover:bg-gray-50 transition-colors">
                                        Cerrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {billingRecords.length === 0 && (
                        <div className="bg-white border border-gray-200 border-dashed rounded-xl p-16 text-center shadow-inner">
                            <div className="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6 border border-gray-100">
                                <Icon name="info" className="w-10 h-10 text-gray-300" />
                            </div>
                            <h4 className="text-xl font-bold text-gray-700 mb-2">No se ha generado distribución</h4>
                            <p className="text-gray-500 text-sm max-w-sm mx-auto leading-relaxed">
                                Seleccione los soportes que desea facturar en la tabla superior y elija el modo de distribución para procesar los pagos consolidados por mes.
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('general');

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-7xl mx-auto space-y-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold text-gray-900">Detalle de Campaña</h2>
                            {activeTab === 'general' && (
                                <div className="flex space-x-2">
                                    <button className="bg-white border px-4 py-2 rounded text-gray-700 hover:bg-gray-50 flex items-center shadow-sm font-medium"><Icon name="copy" className="mr-2" /> Replicar</button>
                                    <button className="bg-white border px-4 py-2 rounded text-gray-700 hover:bg-gray-50 flex items-center shadow-sm font-medium"><Icon name="edit" className="mr-2" /> Editar</button>
                                    <button className="bg-white border px-4 py-2 rounded text-red-600 hover:bg-red-50 flex items-center shadow-sm font-medium"><Icon name="trash-2" className="mr-2" /> Eliminar</button>
                                </div>
                            )}
                        </div>

                        <div className="border-b">
                            <nav className="-mb-px flex space-x-8">
                                <button onClick={() => setActiveTab('general')} className={`pb-4 px-1 border-b-2 font-medium ${activeTab === 'general' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>General</button>
                                <button onClick={() => setActiveTab('facturacion')} className={`pb-4 px-1 border-b-2 font-medium ${activeTab === 'facturacion' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>Facturación</button>
                            </nav>
                        </div>

                        <div className="mt-6">
                            {activeTab === 'general' ? <GeneralTab /> : <FacturacionTab />}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
