<script>
(function () {

/* ===================== Utilidades y componentes ===================== */

  const el = document.createElement('div');

}
function modal(o) {

/* ----- Modal Materiales (se abre con el botón +) ----- */
function matBody() {
  const rows = S.materials.map(m => {
    const editing = S.editMat === m.id, n = countMat(m.name);
    const name = editing
      ? `<div class="input-group input-group-sm"><input class="form-control" id="mat-edit" value="${esc(m.name)}" maxlength="60"><div class="input-group-append"><button class="btn btn-primary" data-act="mat-save" data-id="${m.id}" title="Guardar nombre">${icon('check')}</button><button class="btn btn-secondary" data-act="mat-cancel" title="Cancelar">${icon('close')}</button></div></div>${n ? `<small class="text-muted">Se actualizará en ${n} soporte(s).</small>` : ''}`
      : esc(m.name);
    return `<tr><td style="min-width:260px">${name}</td><td class="number">${n}</td><td>${m.active ? '<span class="badge badge-success">Activo</span>' : '<span class="badge badge-secondary">Inactivo</span>'}</td>
      <td class="actions text-nowrap">${btn('', { cls: 'secondary', size: 'sm', ic: 'edit', act: 'mat-edit', id: m.id, title: 'Renombrar' })} ${btn('', { cls: 'secondary', size: 'sm', ic: m.active ? 'block' : 'check-circle', act: 'mat-toggle', id: m.id, title: m.active ? 'Desactivar' : 'Activar' })}</td></tr>`;
  }).join('');
  return `<div class="input-group input-group-sm mb-3"><input class="form-control" id="mat-new" placeholder="Nombre del nuevo material (ej. Lona backlit 18 oz)" maxlength="60"><div class="input-group-append"><button class="btn btn-primary" data-act="mat-add">${icon('plus')} Añadir</button></div></div>
    <div class="table-responsive"><table class="table table-sm table-striped"><thead><tr><th>Material</th><th class="number">Soportes</th><th>Estado</th><th class="actions"></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small text-muted mt-2">${icon('info-outline')} Renombrar un material lo actualiza en todos los soportes que lo usan. Desactivarlo lo quita del selector, pero los soportes que ya lo tienen lo conservan.</div>`;
}
const refreshMat = () => $('#modal-host .modal-body').html(matBody());
const ACT = {
  'mat-admin'() {
    const $m = modal({ title: 'Materiales <small class="d-block text-muted">Lista de especificaciones de material disponibles para los soportes</small>', size: 'modal-lg', body: matBody(), footer: '<button class="btn btn-secondary" data-dismiss="modal">Cerrar</button>' });
    $m.on('hidden.bs.modal', () => { S.editMat = null; if (S.view === 'form') render(); });
  },
  'mat-add'() {
    const v = $('#mat-new').val().trim(); if (!v) return;
    if (S.materials.some(m => m.name.toLowerCase() === v.toLowerCase())) { notify('Ya existe un material con ese nombre.', 'warning'); return; }
    S.materials.push({ id: Date.now(), name: v, active: true }); notify('Material añadido.'); refreshMat();
  },
  'mat-edit'(id) { S.editMat = +id; refreshMat(); $('#mat-edit').focus().select(); },
  'mat-cancel'() { S.editMat = null; refreshMat(); },
  'mat-save'(id) {
    const m = S.materials.find(x => x.id === +id), v = $('#mat-edit').val().trim();
    if (!v) return;
    if (v === m.name) { S.editMat = null; refreshMat(); return; }
    if (S.materials.some(x => x.id !== m.id && x.name.toLowerCase() === v.toLowerCase())) { notify('Ya existe un material con ese nombre.', 'warning'); return; }
    const n = countMat(m.name);
    S.items.forEach(i => { if (i.material === m.name) i.material = v; });
    if (S.draft && S.draft.material === m.name) S.draft.material = v;
    m.name = v; S.editMat = null; notify(`Material renombrado. Se actualizó en ${n} soporte(s).`); refreshMat();
  },
  'mat-toggle'(id) { const m = S.materials.find(x => x.id === +id); m.active = !m.active; notify(m.active ? 'Material activado.' : 'Material desactivado. Los soportes que lo tienen lo conservan.'); refreshMat(); },
  'item-save'() {
    const it = itemOf(S.cur), d = S.draft, p = v => (v === '' || v == null) ? null : parseFloat(v);
    it.nombre = d.nombre; it.material = d.material; it.ancho = p(d.ancho); it.alto = p(d.alto); it.anchov = p(d.anchov); it.altov = p(d.altov); it.orient = d.orient; it.ilum = d.ilum;
    S.draft = null; notify('El soporte fue guardado.'); S.view = 'ficha'; render(); window.scrollTo(0, 0);
  }
};
$(document).on('click', '[data-act]', function (e) { e.preventDefault(); const f = ACT[this.dataset.act]; if (f) f(this.dataset.id); });
$(document).on('keydown', '#mat-new', function (e) { if (e.key === 'Enter') { e.preventDefault(); ACT['mat-add'](); } });
$(document).on('keydown', '#mat-edit', function (e) { if (e.key === 'Enter') { e.preventDefault(); ACT['mat-save'](S.editMat); } if (e.key === 'Escape') { e.stopPropagation(); ACT['mat-cancel'](); } });

  const info = kv([['Soporte', `<span class="text-primary">${icon('info-outline')}</span> <b>${it.id}</b> — ${esc(it.nombre)}`], ['Estado', taskBadge(t)], ['Responsable', esc(t.asig) + (t.asig === 'Sin asignar' ? '' : ' (Personal)')]]
    .concat(done ? [['Ejecutada por', esc(t.exec)]] : [])
    .concat([['Fecha creación', fslash(t.pub) + ' 18:13'], ['Fecha límite', fslash(t.limite)], ['ODT', `${t.odt} <a href="#" data-noop>${icon('open-in-new')}</a>`],

    + (t.comments ? `<hr><table class="info-table"><tr><th class="pr-3 align-baseline text-nowrap">Comentarios Tarea:</th><td>${esc(t.comments)}</td></tr></table>` : '');
  return protoPick().replace(/Soporte de ejemplo: .*? <span/, `Tarea de ejemplo: ${picker} <span`) +
    `<nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="#" data-noop>${icon('home')}</a></li><li class="breadcrumb-item"><a href="#" data-noop>Tareas</a></li><li class="breadcrumb-item active">${t.id}</li></ol></nav>
    <div class="row"><div class="col-12 col-md-6">
      <div class="card card-border-color"><div class="card-header card-header-divider"><h2 class="card-title">Información tarea — ${esc(t.tipo)}</h2></div><div class="card-body">${info}</div></div>
      <div class="card"><div class="card-header card-header-divider"><h2 class="card-title">Especificaciones${NEW}</h2></div><div class="card-body">${kv([['Especificación material', matLabel(it.material)], ['Dimensiones (total)', `<b>${dim(it.ancho, it.alto)}</b>`], ['Dimensiones (visible)', dim(it.anchov, it.altov)]])}</div></div>
      <div class="card"><div class="card-header card-header-divider"><div class="tools"><a href="#" data-noop>${icon('open-in-new')}</a></div><h2 class="card-title">Información campaña</h2></div><div class="card-body">${kv([['Anunciante', c.client], ['Campaña', t.camp], ['Nombre campaña', esc(c.title)], ['Ejecutivo/a', c.user]])}</div></div>
      <div class="card card-table"><div class="card-header"><h2 class="card-title">Adjuntos</h2><div class="card-subtitle">${t.files.length} archivo(s)</div></div>${t.files.length ? `<table class="table table-sm table-striped">${t.files.map(f => `<tr><td class="no-fill" style="width:1%"><a href="#" data-noop>${icon('download')}</a></td><td>${esc(f)}</td></tr>`).join('')}</table>` : ''}</div>
    </div><div class="col-12 col-md-6 d-none d-md-block"><div class="photo-big"><span class="zmdi zmdi-${TYPE_ICON[it.tipo]}"></span></div></div></div>`;
}

/* ===================== 4. Reporte de tareas (Operaciones): 2 tabs, el reporte se ve de inmediato ===================== */
function repTable(open) {
  const n = k => t => { const v = itemOf(t.item)[k]; return v == null ? '' : num(v); };
  let rows = S.tasks.filter(t => open ? !t.closed : (!!t.closed && (!S.repFrom || t.closed >= S.repFrom) && (!S.repTo || t.closed <= S.repTo)));
  const cols = [
    { h: 'Código', f: t => `<b>${t.id}</b>` }, { h: 'Tipo de tarea', f: t => esc(t.tipo) }, { h: 'Soporte', f: t => t.item }, { h: 'ODT', f: t => t.odt }, { h: 'Campaña', f: t => t.camp },
    { h: 'Asignado', f: t => esc(t.asig) }, { h: 'Fecha límite', f: t => fdate(t.limite) }, { h: 'Publicada', f: t => fdate(t.pub) },
    { h: 'Especificación material', cls: 'col-new', f: t => esc(itemOf(t.item).material) },
    { h: 'Ancho total (m)', cls: 'col-new number', f: n('ancho') }, { h: 'Alto total (m)', cls: 'col-new number', f: n('alto') },
    { h: 'Ancho visible (m)', cls: 'col-new number', f: n('anchov') }, { h: 'Alto visible (m)', cls: 'col-new number', f: n('altov') }
  ].concat(open ? [{ h: 'Estado', f: t => taskBadge(t) }] : [{ h: 'Fecha cierre', f: t => fdate(t.closed) }, { h: 'Ejecutor', f: t => esc(t.exec) }]);
  return { html: tbl(cols, rows), n: rows.length };
}
function viewRep() {
  const open = S.repTab === 'open', r = repTable(open);
  return head('Reportes') + `<div class="card card-border-color"><ul class="nav nav-tabs">
      <li class="nav-item"><a class="nav-link ${open ? 'active' : ''}" data-rtab="open">Tareas pendientes</a></li>
      <li class="nav-item"><a class="nav-link ${open ? '' : 'active'}" data-rtab="done">Tareas finalizadas</a></li></ul>
    <div class="card-body">
      <p class="text-muted mb-3">${open ? 'Tareas pendientes y atrasadas, con responsable y fecha límite.' : 'Tareas cerradas dentro de un periodo.'} Incluye la especificación de material y las medidas del soporte.${NEW}</p>
      ${open ? '' : `<div class="form-row mb-3" style="max-width:420px"><div class="col-6"><label>Desde</label><input type="date" class="form-control form-control-sm" data-rf="repFrom" value="${S.repFrom}"></div><div class="col-6"><label>Hasta</label><input type="date" class="form-control form-control-sm" data-rf="repTo" value="${S.repTo}"></div></div>`}
      <div class="small text-muted mb-2">Mostrando ${r.n} tarea(s)</div>
      <div class="card card-table mb-0" style="box-shadow:none;border:1px solid #eee">${r.html}</div>
    </div></div>`;
}
$(document).on('click', '[data-rtab]', function (e) { e.preventDefault(); S.repTab = this.dataset.rtab; render(); });
$(document).on('change', '[data-rf]', function () { S[this.dataset.rf] = this.value; render(); });

/* ===================== Render ===================== */
$(document).on('change', '[data-pick]', function () { if (this.dataset.pick === 'item') { S.cur = this.value; S.draft = null; } else S.task = this.value; render(); });
function render() {
  $('.tooltip').remove();
  drawChrome();
  $('#content').html({ ficha: viewFicha, form: viewForm, tarea: viewTarea, rep: viewRep }[S.view]());
  $('[data-toggle="tooltip"]').tooltip();
}
render();
})();
</script>
</body>
</html>
