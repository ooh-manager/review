  o = o || { nombre: '', razon: '', rut: '', giro: '', email: '', dir: '', cat: '', agency: '', ejecutivo: '', parent: '' };
  const brands = ref ? brandsOf(ref) : [];
  const marcas = n ? '<p class="text-muted mb-0">Guarda el registro para poder agregar marcas.</p>' : `<div class="d-flex justify-content-between mb-2"><input class="form-control form-control-sm" style="width:200px" data-psearch="blk-mar" placeholder="Buscar"><button type="button" class="btn btn-secondary btn-sm" data-act="brand-new-for" data-id="${ref}">${icon('plus')} Nueva marca</button></div><div id="blk-mar">${brands.length ? `<div class="table-responsive"><table class="table table-sm table-striped mb-0"><thead><tr><th>Marca</th>${isC ? '' : '<th>Anunciante</th>'}<th>Contacto</th><th>Teléfono</th><th>Correo</th><th>Ejecutivo</th></tr></thead><tbody>${brands.map(b => { const c = by(DB.contacts, isC ? b.conC : b.conA) || {}; return `<tr class="pitem"><td>${esc(b.nombre)}</td>${isC ? '' : `<td>${b.cli ? esc(partyName('c:' + b.cli)) : '—'}</td>`}<td>${esc(c.nombre) || '—'}</td><td>${esc(c.tel) || '—'}</td><td>${esc(c.email) || '—'}</td><td>${b.ejecutivo || '—'}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="text-muted mb-0">Sin marcas.</p>'}</div>`;
  return { title: (n ? 'Crear ' : 'Editar ') + t, html: head((n ? 'Crear ' : 'Editar ') + t) + `<form id="f-party" novalidate><div class="row"><div class="col-lg-7">${card('Información general', `<div class="form-row">${fld('Nombre', 'nombre', o.nombre, { req: 1, cls: 'col-md-12' })}</div>${isC ? `<div class="form-row">${fld('Categoría', 'cat', o.cat, { type: 'select', opts: [['', 'Ninguna']].concat(CATEGORIES), cls: 'col-md-4' })}${fld('Agencia', 'agency', o.agency, { type: 'select', opts: [['', 'Sin agencia']].concat(DB.agencies.map(a => [a.id, a.nombre])), cls: 'col-md-4' })}${fld('Responsable', 'ejecutivo', o.ejecutivo, { type: 'select', opts: [['', 'Ninguno']].concat(USERS), cls: 'col-md-4' })}</div>` : `<div class="form-row">${fld('Asignar a grupo (agencia matriz)', 'parent', o.parent, { type: 'select', opts: [['', 'Sin grupo']].concat(DB.agencies.filter(a => a !== o).map(a => [a.id, a.nombre])), cls: 'col-md-6' })}${fld('Responsable', 'ejecutivo', o.ejecutivo, { type: 'select', opts: [['', 'Ninguno']].concat(USERS), cls: 'col-md-6' })}</div>`}`)}</div>
    <div class="col-lg-5">${card('Datos de facturación', `<div class="form-row">${fld('Razón social', 'razon', o.razon, { req: 1, cls: 'col-md-7' })}${fld('RUT', 'rut', o.rut, { req: 1, ph: '12.345.678-9', cls: 'col-md-5' })}</div><div class="form-row">${fld('Giro', 'giro', o.giro, { cls: 'col-md-6' })}${fld('E-mail', 'email', o.email, { type: 'email', cls: 'col-md-6' })}</div>${fld('Dirección', 'dir', o.dir)}`)}</div></div>
    ${card('Marcas', marcas)}<div class="mb-4">${submitBtn(n ? 'Crear ' + t : 'Guardar cambios')}${btn('Cancelar', { cls: 'secondary', href: '#' + partyBase(k) })}</div></form>`,
    after() { document.getElementById('f-party').addEventListener('submit', e => { e.preventDefault(); const f = e.target, errs = [];
      if (!f.nombre.value.trim()) errs.push('El nombre es obligatorio.'); if (!f.razon.value.trim()) errs.push('La razón social es obligatoria.');
      if (!validRut(f.rut.value.trim())) errs.push('El RUT no tiene un formato válido (ej: 76.123.456-7).'); else if (arr.some(x => x !== o && x.rut === f.rut.value.trim())) errs.push('Ya existe un registro con ese RUT.');
      if (errs.length) { notify(errs.join('<br>'), 'warning'); return; }
      const v = { nombre: f.nombre.value.trim(), razon: f.razon.value.trim(), rut: f.rut.value.trim(), giro: f.giro.value, email: f.email.value, dir: f.dir.value, ejecutivo: f.ejecutivo.value };
      if (isC) Object.assign(v, { cat: f.cat.value, agency: f.agency.value }); else v.parent = f.parent.value;
      if (n) { v.id = nextId(isC ? 'C' : 'A', arr); arr.push(v); o = v; } else Object.assign(o, v);
      notify(n ? (isC ? 'El anunciante ha sido creado.' : 'La agencia ha sido creada.') : 'Los cambios fueron guardados.'); go('/clientes/' + k + '-' + o.id); }); } };
}
route(/^\/anunciantes\/nuevo$/, () => partyForm('c', null));
route(/^\/agencias\/nueva$/, () => partyForm('a', null));
route(/^\/anunciantes\/([^/]+)\/editar$/, id => by(DB.clients, id) ? partyForm('c', by(DB.clients, id)) : notFoundPage('Anunciante'));
route(/^\/agencias\/([^/]+)\/editar$/, id => by(DB.agencies, id) ? partyForm('a', by(DB.agencies, id)) : notFoundPage('Agencia'));

/* =====================================================================
   ▶ [CRM-24] ACERCA DEL PROTOTIPO · qué es real, qué es simulado (#/acerca)
   ===================================================================== */
route(/^\/acerca$/, () => ({ title: 'Acerca del prototipo', html: head('Acerca del prototipo') + `<div class="row"><div class="col-lg-8">${card('Qué es este prototipo', `<p>Prototipo clickeable del módulo <b>CRM</b> a partir del wireframe <i>CRM.pdf</i>. Sirve para validar el flujo con stakeholders y dev; no guarda datos (al recargar la página vuelve al estado inicial).</p>
    <h6>Datos</h6><ul><li><b>Soportes:</b> los 8 soportes de ejemplo usan precios reales de QA.</li><li><b>Anunciantes, agencias, marcas, contactos, negocios, cotizaciones, campañas, documentos y actividades:</b> inventados para la demostración.</li></ul>
    <h6>Simulado</h6><ul><li>La selección de soportes de la cotización (catálogo, mapa, reservas, precios): se muestran soportes fijos; el módulo Comercial tiene el flujo real.</li><li>Autorización, confirmación de campaña y edición avanzada.</li><li>Permisos por ejecutivo: todos ven todo.</li><li>Descarga de documentos adjuntos.</li></ul>
    <h6>Supuestos tomados donde el wireframe no define</h6><ul><li>La cotización tiene su propio estado CRM (Nuevo, En seguimiento, En negociación, Ganado, Perdido), independiente del estado del negocio.</li><li>El estado del negocio se cambia a mano (editar, o arrastrando la tarjeta en el kanban).</li><li>Al elegir un negocio en la cotización se completan marca, presupuesto, período y ejecutivo si están vacíos.</li><li>El estado del cliente en el panel se calcula: «Activo» si tiene campañas vigentes o negocios abiertos.</li><li>Una marca necesita al menos un anunciante o una agencia.</li><li>Se agregaron botones «+» en los bloques Contactos y Negocios del panel y en la tarjeta CRM de la cotización (el wireframe solo lo muestra en la cotización).</li></ul>
    <p class="mb-0 text-muted">Las preguntas abiertas están en el documento de discovery (<i>DISCOVERY-CRM.md</i>).</p>`)}</div></div>` }));

/* =====================================================================
   ▶ [CRM-25] ARRANQUE · carga inicial
   ===================================================================== */
document.getElementById('menu').innerHTML = '<li class="divider">CRM</li>' + menuHtml(MENU) + '<li class="divider">Admin</li>' + menuHtml(MENU_ADMIN) + '<li class="divider">Prototipo</li>' + menuHtml(MENU_INFO);
$(document).ready(function () { render(); });
})();
</script>
</body>
</html>
