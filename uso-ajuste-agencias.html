const svcPrice = (service, item) => ((DB.serviceItems.find(s => s.service === service && s.item === item)) || {}).price || 0;
const svcLease = d => sum(d.services.filter(s => s.pricing === 'lease').map(s => s.price));
const svcProd = d => sum(d.services.filter(s => s.pricing === 'production').map(s => s.price));
const dealLease = d => sum(d.bids.map(b => b.net)) + svcLease(d);
const dealProd = d => sum(d.bids.map(b => +b.prod || 0)) + svcProd(d);
const dealTotal = d => dealLease(d) + dealProd(d);

/* Los cuatro precios que admiten ajuste. Cada uno tiene UNA sola regla: sin ajuste, descuento o recargo. */
const PKEYS = [['minimo', 'Precio mínimo'], ['tarifa', 'Precio mensual'], ['prod', 'Precio producción'], ['serv', 'Servicios adicionales']];
const emptyRules = () => ({ tarifa: { t: '', p: 0 }, minimo: { t: '', p: 0 }, prod: { t: '', p: 0 }, serv: { t: '', p: 0 } });
const normRules = r => { const o = emptyRules(); PKEYS.forEach(([k]) => { const x = (r || {})[k] || {}; if ((x.t === 'desc' || x.t === 'rec') && +x.p > 0) o[k] = { t: x.t, p: +x.p }; }); return o; };
const hasRules = r => !!r && PKEYS.some(([k]) => r[k] && r[k].t);
const rulesKey = r => hasRules(r) ? JSON.stringify(normRules(r)) : '';
const realAgency = id => id && id !== 'placeholder' ? agencyOf(id) : null;
const agencyRules = id => { const a = realAgency(id); return a ? normRules(a.adj) : emptyRules(); };
const adjVal = (rule, v) => (!rule || !rule.t) ? v : Math.max(0, Math.round(v * (rule.t === 'desc' ? 1 - rule.p / 100 : 1 + rule.p / 100)));
const pctNum = p => String(+p).replace('.', ',');
const pctTxt = rule => rule && rule.t ? (rule.t === 'desc' ? '−' : '+') + pctNum(rule.p) + ' %' : '';
const ruleWord = rule => rule && rule.t ? (rule.t === 'desc' ? 'Descuento ' : 'Recargo ') + pctNum(rule.p) + ' %' : 'Sin ajuste';
/* Etiqueta de un precio: rojo = descuento, azul = recargo, gris = sin ajuste (±0 %). Siempre se muestran los cuatro, en el mismo orden. */
const chipCls = rule => rule && rule.t === 'desc' ? 'adj-desc' : rule && rule.t === 'rec' ? 'adj-rec' : 'adj-zero';
const chipTxt = rule => rule && rule.t ? pctTxt(rule) : '±0 %';
const rulesChips = r => `<span class="adj-chips">${PKEYS.map(([k, l]) => `<span class="badge adj-chip ${chipCls(r[k])}">${l} ${chipTxt(r[k])}</span>`).join('')}</span>`;
const adjBadge = rule => `<span class="badge adj-chip ${chipCls(rule)}">${rule && rule.t ? ruleWord(rule) : 'Sin ajuste'}</span>`;

/* Reglas con las que quedaron valorizados los precios de una cotización (foto al momento de ajustar). */
const dealRules = d => normRules((d.adjApplied || {}).rules);
const minOf = (d, it) => adjVal(dealRules(d).minimo, it.minimo);

/* Recalcula los precios de la cotización desde el Precio mensual, aplicando las reglas de la agencia (o las indicadas).
   Sobrescribe lo que haya en precio individual, producción y servicios. Sin agencia o sin reglas = Precio mensual. */
function repriceDeal(d, rules) {
  rules = normRules(rules || agencyRules(d.agency));
  d.bids.forEach(b => { const it = itemOf(b.item); b.unit = adjVal(rules.tarifa, it.tarifa); b.prod = adjVal(rules.prod, it.prod); b.net = bidNet(b); });
  d.services.forEach(s => { s.price = adjVal(rules.serv, svcPrice(s.service, s.item)); });
  d.adjApplied = { agency: d.agency, rules };
}

function fld(label, name, val, o) {
  o = o || {}; val = val == null ? '' : val; const t = o.type || 'text'; let ctl;

    ctl = `<select class="form-control form-control-sm" name="${name}" ${o.req ? 'required' : ''}>${(o.opts || []).map(x => { const v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x; return `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  } else if (t === 'textarea') {

  } else {
    ctl = `<input class="form-control form-control-sm" type="${t}" name="${name}" value="${esc(val)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.req ? 'required' : ''} ${o.min != null ? `min="${o.min}"` : ''} ${o.step ? `step="${o.step}"` : ''}>`;

/* =====================================================================
   ▶ [AJ-09b] IMPORTADOR DE AGENCIAS · hojas Agencias, Contactos y Ajustes de precios
   Replica el flujo real: archivo Excel con las hojas «Agencias», «Contactos» y, opcional, «Ajustes de precios» (tercera);
   la hoja «Referencias» es solo informativa. Los ajustes se vinculan por ID a una fila actualizable de Agencias.
   Validación previa: cualquier observación aborta la importación completa. Resultados por correo (simulado).
   ===================================================================== */
const IMP_OPS = [[0, 'Solo crear agencias'], [1, 'Actualizar agencias (por ID)'], [2, 'Crear y actualizar agencias (por ID)']];
const IMP_MAX_ROWS = 2000;
const ADJ_SHEET = 'Ajustes de precios', REF_SHEET = 'Referencias';
const IMP_HDR_AG = ['ID', 'Nombre', 'Razón social', 'Número identificador nacional', 'Giro', 'Dirección', 'E-mail', 'Grupo'];
const IMP_HDR_CO = ['ID', 'Tipo de contacto', 'Nombre', 'E-mail', 'Teléfono', 'Agencia (ID)'];
const IMP_HDR_AJ = ['ID', 'Nombre'].concat(PKEYS.reduce((o, a) => o.concat([a[1], 'Porcentaje %']), []));
/* Códigos fijos del Excel: 0 = Sin ajuste, 1 = Recargo, 2 = Descuento */
const ADJ_CODES = { 0: '', 1: 'rec', 2: 'desc' };
const ADJ_CODE_OF = { '': 0, rec: 1, desc: 2 };
const impKey = h => norm(h).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const CAT_ES = { financial: 'Financiero', commercial: 'Comercial' };
const emailOk = e => !e || /^\S+@\S+\.\S+$/.test(e);
const allContacts = () => DB.agencies.reduce((o, a) => o.concat((a.contacts || []).map(c => Object.assign({ agency: a.id }, c))), []);
const IMP_DEMO = { wb: null };   /* libro en memoria que usan las demostraciones en lugar de un archivo real */
let IMP_LAST = [];

/* Lee una hoja y devuelve filas { n: nº de fila en el archivo, v: valores por encabezado }, los encabezados que faltan y las columnas presentes */
function impSheet(ws, headers) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
  if (!aoa.length) return { missing: headers, keys: [] };
  const want = headers.map(impKey), keys = (aoa[0] || []).map(impKey);
  const missing = headers.filter((h, i) => !keys.includes(want[i]));
  if (missing.length) return { missing, keys };
  if (aoa.length - 1 > IMP_MAX_ROWS) return { tooMany: true, keys };
  const rows = aoa.slice(1).map((r, i) => ({ n: i + 2, v: want.reduce((o, k) => { const c = r[keys.indexOf(k)]; o[k] = String(c == null ? '' : c).trim(); return o; }, {}) })).filter(r => Object.values(r.v).some(x => x !== ''));
  return { rows, keys };
}
const gv = (r, h) => r.v[impKey(h)] || '';
/* Columnas de ajustes que NO pueden venir dentro de la hoja Agencias */
const isAdjHeader = k => PKEYS.some(p => k === impKey(p[1]) || k.indexOf(impKey(p[1]) + '_') === 0);

/* Hoja «Ajustes de precios»: los diez encabezados deben estar en este orden (el porcentaje se repite, por eso se lee por posición). */
function impSheetAdj(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
  const head = (aoa[0] || []).map(x => String(x == null ? '' : x).trim());
  const want = IMP_HDR_AJ.map(impKey);
  if (!aoa.length || head.filter(Boolean).length !== want.length || want.some((k, i) => impKey(head[i]) !== k)) return { badHeaders: true };
  if (aoa.length - 1 > IMP_MAX_ROWS) return { tooMany: true };
  const cell = (r, c) => String(r[c] == null ? '' : r[c]).trim();
  const rows = aoa.slice(1).map((r, i) => ({ n: i + 2, id: cell(r, 0), vals: PKEYS.map((p, j) => ({ k: p[0], l: p[1], code: cell(r, 2 + j * 2), pct: cell(r, 3 + j * 2) })) }))
    .filter(r => r.id || r.vals.some(v => v.code || v.pct));
  return { rows };
}

/* Etapa 1 · validación previa de todo el archivo. Cualquier observación aborta la importación completa. */
function impStage1(rows, sheet, noun, existing, op, withName) {
  const skipped = [], ids = new Set(existing.map(x => String(x.id)));
  const dup = h => { const c = {}; rows.forEach(r => { const x = gv(r, h); if (x) c[x] = (c[x] || 0) + 1; }); return new Set(Object.keys(c).filter(k => c[k] > 1)); };
  const dupId = dup('ID'), dupName = withName ? dup('Nombre') : new Set();
  const plan = rows.map(r => {
    const id = gv(r, 'ID'), add = reason => skipped.push({ sheet, row: r.n, reason }); let fn;
    if (id && dupId.has(id)) add(`ID duplicado: ${id}.`);
    if (withName && gv(r, 'Nombre') && dupName.has(gv(r, 'Nombre'))) add(`Nombre duplicado: ${gv(r, 'Nombre')}.`);
    if (withName && !validRut(gv(r, 'Número identificador nacional'))) add(`Formato incorrecto para Número identificador nacional "${gv(r, 'Número identificador nacional')}"`);
    if (op === 0) { if (ids.has(id)) { add(`Solo crear no admite un ID existente: ${id}.`); fn = 'skip'; } else fn = 'create'; }
    else if (op === 1) { if (ids.has(id)) fn = 'update'; else { add(`El ID debe identificar un registro existente autorizado: ${id || '(vacío)'}.`); fn = 'skip'; } }
    else fn = ids.has(id) ? 'update' : 'create';
    return { r, fn };
  });
  return { plan, skipped };
}

/* Etapa 1 de la hoja de ajustes: cada fila vincula por ID con una fila ACTUALIZABLE de Agencias del mismo archivo.
   Fila explícita = reemplaza las cuatro reglas (0 o vacío con porcentaje vacío elimina la regla). Sin hoja o sin fila = se conservan. */
function impStage1Adj(rows, agPlan, op) {
  const skipped = [], rules = {}, seen = {};
  rows.forEach(r => {
    const add = reason => skipped.push({ sheet: ADJ_SHEET, row: r.n, reason });
    if (op === 0) { add('Solo crear no admite filas de datos de ajustes.'); return; }
    if (r.id && seen[r.id]) add(`ID duplicado: ${r.id}.`);
    seen[r.id] = 1;
    if (!agPlan.some(p => p.fn === 'update' && gv(p.r, 'ID') === r.id)) { add(`El ID de ajustes debe coincidir con una fila actualizable de Agencias en este archivo: ${r.id || '(vacío)'}.`); return; }
    const out = emptyRules(); let bad = false;
    r.vals.forEach(v => {
      if (!['', '0', '1', '2'].includes(v.code)) { add(`Valor inválido para ${v.l}: ${v.code}.`); bad = true; return; }
      const praw = v.pct.replace('%', '').replace(',', '.').trim();
      if (v.code === '' || v.code === '0') {
        if (praw) { add(v.code === '0' ? `${v.l}: 0 no admite ningún porcentaje.` : 'Un porcentaje requiere Descuento o Recargo.'); bad = true; }
        return;
      }
      const t = ADJ_CODES[v.code], p = +praw;
      if (!praw || !isFinite(p) || !(p > 0) || Math.round(p * 100) / 100 !== p) { add(`Valor inválido para ${v.l} - Porcentaje %: ${v.pct || '(vacío)'}. Debe ser mayor que cero y con hasta dos decimales.`); bad = true; return; }
      if (t === 'desc' && p > 100) { add(`${v.l}: el descuento no puede superar 100.`); bad = true; return; }
      out[v.k] = { t, p };
    });
    if (!bad) rules[r.id] = out;
  });
  return { skipped, rules };
}

/* Etapa 2 · importación: cada fila se valida como modelo; las fallidas se informan en el correo y el resto se importa. */
function impAgency(r, fn, res, adjRules) {
  const errs = [], ex = fn === 'update' ? by(DB.agencies, gv(r, 'ID')) : null, grupo = gv(r, 'Grupo');
  if (!gv(r, 'Nombre')) errs.push('Nombre no puede estar en blanco');
  if (!emailOk(gv(r, 'E-mail'))) errs.push('E-mail no es válido');
  if (grupo) { const p = by(DB.agencies, grupo);
    if (!p) errs.push(`El grupo debe identificar una agencia existente autorizada: ${grupo}.`); else if (ex && p.id === ex.id) errs.push('No se puede asignar una agencia a sí misma');
    else if (p.parent) errs.push('El grupo elegido ya pertenece a otro grupo'); else if (ex && DB.agencies.some(a => a.parent === ex.id)) errs.push('Una agencia con subagencias no puede pertenecer a un grupo'); }
  if (errs.length) { res.skipped.push({ sheet: 'Agencias', row: r.n, reason: errs.join('; ') + (adjRules ? '. No se pudo guardar la agencia y sus ajustes de precios. No se aplicaron cambios.' : '') }); return; }
  const v = { nombre: gv(r, 'Nombre'), razon: gv(r, 'Razón social'), rut: gv(r, 'Número identificador nacional').toUpperCase(), giro: gv(r, 'Giro'), dir: gv(r, 'Dirección'), email: gv(r, 'E-mail').toLowerCase(), parent: grupo };
  if (!ex) { DB.agencies.push(Object.assign({ id: nextId('A', DB.agencies), contacts: [], adj: emptyRules() }, v)); res.created.ag++; return; }
  if (adjRules) { v.adj = adjRules; res.updated.aj++; }   /* sin fila de ajustes se conservan las reglas actuales */
  Object.assign(ex, v); res.updated.ag++;
}
function impContact(r, fn, res) {
  const errs = [], cat = { financiero: 'financial', comercial: 'commercial' }[norm(gv(r, 'Tipo de contacto'))], comp = by(DB.agencies, gv(r, 'Agencia (ID)'));
  const cur = fn === 'update' ? allContacts().find(c => String(c.id) === gv(r, 'ID')) : null;
  if (!gv(r, 'Nombre')) errs.push('Nombre no puede estar en blanco');
  if (!cat) errs.push('Tipo de contacto no es válido (usa Financiero o Comercial)');
  if (!emailOk(gv(r, 'E-mail'))) errs.push('E-mail no es válido');
  if (!comp) errs.push(`El contacto debe pertenecer a una agencia existente autorizada: ${gv(r, 'Agencia (ID)')}.`);
  else if (cat && (comp.contacts || []).some(c => c.category === cat && (!cur || c.id !== cur.id))) errs.push('Solo se permite un contacto por tipo y un máximo de dos por agencia.');
  if (errs.length) { res.skipped.push({ sheet: 'Contactos', row: r.n, reason: errs.join('; ') }); return; }
  const v = { category: cat, name: gv(r, 'Nombre'), email: gv(r, 'E-mail').toLowerCase(), phone: gv(r, 'Teléfono') };
  if (!cur) { comp.contacts = comp.contacts || []; comp.contacts.push(Object.assign({ id: 'K' + (allContacts().length + 1 + Math.floor(Math.random() * 1000)) }, v)); res.created.co++; return; }
  const old = by(DB.agencies, cur.agency); old.contacts = old.contacts.filter(c => c.id !== cur.id); comp.contacts = comp.contacts || []; comp.contacts.push(Object.assign({ id: cur.id }, v)); res.updated.co++;
}

/* Proceso completo sobre un libro ya leído (archivo real o libro de la demostración). Devuelve una promesa que termina con el «correo». */
function runImport(wb, isCsv, op, alert_, box) {
  const agName = isCsv ? wb.SheetNames[0] : 'Agencias';
  if (!wb.Sheets[agName]) { alert_('danger', "El archivo no tiene una hoja llamada 'Agencias'"); return Promise.resolve(false); }
  if (!isCsv && !wb.Sheets['Contactos']) { alert_('danger', "El archivo no tiene una hoja llamada 'Contactos'"); return Promise.resolve(false); }
  const hasAdj = !isCsv && !!wb.Sheets[ADJ_SHEET];
  if (hasAdj && !isAdmin()) { alert_('danger', 'Los ajustes de precios no están disponibles para esta importación.'); return Promise.resolve(false); }
  const ag = impSheet(wb.Sheets[agName], IMP_HDR_AG);
  if ((ag.keys || []).some(isAdjHeader)) { alert_('danger', 'Las columnas de ajustes deben estar en Ajustes de precios, no en Agencias.'); return Promise.resolve(false); }

/* =====================================================================
   ▶ [AJ-12] MANUAL · pantalla de inicio y demostraciones animadas
   Cada demostración maneja la propia pantalla del prototipo (cursor, escritura y clics reales) mientras explica cada paso.
   ===================================================================== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const STOP = { stop: true };
let RUN = 0;
const q = s => typeof s === 'function' ? s() : document.querySelector(s);
const rowOf = (scope, text) => () => Array.from(document.querySelectorAll(scope + ' tbody tr')).find(tr => tr.textContent.includes(text));

/* Recuadro «Cómo funciona» de cada pantalla */
function howto(text, demo) {

}
/* Detalle de una agencia: descripción, referencia y resultado de ejemplo de cada precio */
function adjDetails(r) {

    return `<div class="row py-2 border-bottom"><div class="col-sm-4 text-bold">${l}</div><div class="col-sm-8"><strong class="d-block ${cls}">${ruleWord(rule)}</strong><div class="text-muted small">Referencia: ${clp(ADJ_REF[k])}</div><div class="small">Resultado de ejemplo: ${clp(adjVal(rule, ADJ_REF[k]))}</div></div></div>`;
  }).join('');

/* ---------- Motor de demostraciones · paso a paso (Anterior / Siguiente), nunca avanza solo ---------- */
const DB0 = JSON.stringify(DB);   /* datos iniciales: cada demostración parte siempre del mismo estado */
let DEMO = null;
const clearFrames = () => document.querySelectorAll('.demo-frame').forEach(e => e.remove());
function resetDemo() { Object.assign(DB, JSON.parse(DB0)); $('.modal').modal('hide'); IMP_DEMO.wb = null; clearFrames(); }

/* Sube el elemento a la zona libre de la pantalla: bajo la barra superior y sobre el panel de pasos (que ocupa ~200 px abajo) */
function bring(el) {
  if (el.closest('.modal')) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  const r = el.getBoundingClientRect(), top = 125, free = innerHeight - top - 215;
  const want = r.height < free ? top + (free - r.height) / 2 : top;
  window.scrollBy({ top: r.top - want, behavior: 'smooth' });
}
/* fast = reconstruye el estado de pasos anteriores sin animación (para «Anterior») */
function mkDriver(id, fast) {
  const chk = () => { if (id !== RUN) throw STOP; };
  const cur = () => document.getElementById('demo-cursor');
  const nap = ms => fast ? (ms >= 1400 ? 1100 : Math.min(ms, 120)) : ms;
  const D = {
    wait: async ms => { await sleep(nap(ms)); chk(); },
    role: async r => { if (ROLE !== r) { ACT.role(r); } await D.wait(500); },
    go: async h => { if (location.hash === '#' + h) render(); else location.hash = h; await D.wait(600); },
    point: async sel => {
      clearFrames();
      const el = q(sel); if (!el) throw new Error('Demostración: no se encontró ' + sel);
      if (fast) return el;
      bring(el); await D.wait(550);
      const r = el.getBoundingClientRect(), c = cur(); c.hidden = false;
      c.style.transform = `translate(${Math.round(r.left + Math.min(r.width * 0.5, 70))}px, ${Math.round(r.top + r.height / 2)}px)`;
      await D.wait(900); return el;
    },
    click: async sel => { const el = await D.point(sel); if (!fast) { const c = cur(); c.classList.add('click'); await D.wait(280); c.classList.remove('click'); } el.click(); await D.wait(500); },
    select: async (sel, v) => { const el = await D.point(sel); el.focus(); el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); await D.wait(700); },
    type: async (sel, txt) => {
      const el = await D.point(sel); el.focus(); el.value = ''; el.dispatchEvent(new Event('input', { bubbles: true }));
      if (fast) el.value = String(txt), el.dispatchEvent(new Event('input', { bubbles: true }));
      else for (const ch of String(txt)) { el.value += ch; el.dispatchEvent(new Event('input', { bubbles: true })); await D.wait(90); }
      el.dispatchEvent(new Event('change', { bubbles: true })); await D.wait(400);
    },
    /* Un solo marco que rodea todos los elementos indicados; queda visible hasta que cambie el paso */
    hl: async sel => {
      if (fast) return;
      const els = typeof sel === 'function' ? [].concat(sel() || []) : Array.from(document.querySelectorAll(sel));
      if (!els.length) throw new Error('Demostración: no se encontró ' + sel);
      clearFrames(); bring(els[0]); await D.wait(650);
      const rs = els.map(e => e.getBoundingClientRect()), l = Math.min(...rs.map(r => r.left)), t = Math.min(...rs.map(r => r.top)), rt = Math.max(...rs.map(r => r.right)), b = Math.max(...rs.map(r => r.bottom));
      const f = document.createElement('div'); f.className = 'demo-frame';
      f.style.cssText = `left:${l - 6}px;top:${t - 6}px;width:${rt - l + 12}px;height:${b - t + 12}px`; document.body.appendChild(f); await D.wait(300);
    }
  };
  return D;
}
function demoUi(on) {
  ['demo-shield', 'demo-coach'].forEach(i => { document.getElementById(i).hidden = !on; });
  document.body.classList.toggle('demo-on', on);
  if (!on) { document.getElementById('demo-cursor').hidden = true; clearFrames(); }
}
const stepText = (demo, i) => { const s = demo.steps[i][0]; return (typeof s === 'function' ? s() : s) + (i === demo.steps.length - 1 && demo.end ? `<div class="dc-end-note">${demo.end}</div>` : ''); };
function paintCoach() {
  const st = DEMO; if (!st) return; const n = DEMOS[st.key].steps.length, c = document.getElementById('demo-coach');
  c.querySelector('.dc-count').textContent = `Paso ${st.cur + 1} de ${n}`;
  c.querySelector('.progress-bar').style.width = Math.round(((st.cur + 1) / n) * 100) + '%';
  document.getElementById('demo-prev').disabled = st.busy || st.idx <= 0;
  const nx = document.getElementById('demo-next'); nx.disabled = st.busy;
  nx.innerHTML = st.idx >= n - 1 ? 'Finalizar' : 'Siguiente ▶';
  nx.classList.toggle('btn-success', st.idx >= n - 1); nx.classList.toggle('btn-primary', st.idx < n - 1);
}
async function gotoStep(target) {
  const st = DEMO; if (!st || st.busy) return;
  const demo = DEMOS[st.key], txt = document.querySelector('#demo-coach .dc-text'), id = ++RUN;
  st.busy = true; st.cur = target; clearFrames(); paintCoach();
  try {
    if (target <= st.idx) {   /* volver: se rehace el estado de los pasos previos al instante y se anima solo el paso elegido */
      txt.innerHTML = '<i>Volviendo al paso…</i>'; resetDemo(); const F = mkDriver(id, true); await F.role(st.role);
      for (let i = 0; i < target; i++) await demo.steps[i][1](F);
    }
    clearFrames(); txt.innerHTML = stepText(demo, target);
    await demo.steps[target][1](mkDriver(id, false));
    st.idx = target;
  } catch (e) {
    if (e !== STOP) { console.error(e); txt.innerHTML = 'No pude mostrar este paso en esta pantalla. Cierra la demostración y vuélvela a abrir, o recarga la página.'; }
  } finally {
    if (DEMO === st && id === RUN) { st.busy = false; document.getElementById('demo-cursor').hidden = true; paintCoach(); }
  }
}
async function startDemo(key) {
  if (!DEMOS[key]) return;
  ++RUN; $('.modal').modal('hide'); resetDemo();
  DEMO = { key, role: ROLE, idx: -1, cur: 0, busy: false };
  document.querySelector('#demo-coach .dc-title').textContent = DEMOS[key].title;
  demoUi(true); await gotoStep(0);
}
ACT.demo = key => { startDemo(key); };
const stopDemo = () => { RUN++; DEMO = null; demoUi(false); IMP_DEMO.wb = null; };
document.addEventListener('click', e => {
  if (e.target.closest('#demo-stop')) stopDemo();
  else if (e.target.closest('#demo-prev')) { if (DEMO && !DEMO.busy && DEMO.idx > 0) gotoStep(DEMO.idx - 1); }
  else if (e.target.closest('#demo-next')) { if (!DEMO || DEMO.busy) return; if (DEMO.idx >= DEMOS[DEMO.key].steps.length - 1) stopDemo(); else gotoStep(DEMO.idx + 1); }
});
document.addEventListener('keydown', e => {
  if (!DEMO) return;
  if (e.key === 'Escape') stopDemo();
  else if (e.key === 'ArrowRight') document.getElementById('demo-next').click();
  else if (e.key === 'ArrowLeft') document.getElementById('demo-prev').click();

/* Solo instrucciones: las pantallas son de referencia y la persona no puede operarlas. Las demostraciones usan eventos sintéticos (no confiables) y sí pueden. */
const OK_USER = 'a[href^="#/"], [data-act="demo"], [data-act="xl-open"], [data-act="imp-help"], .calc-ok';
['click', 'submit', 'input', 'change', 'keydown', 'keypress', 'beforeinput', 'mousedown'].forEach(type => document.addEventListener(type, e => {
